<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Cosmetics Library (prototype): search or browse Bed Wars cosmetics and see each one
     in a 3D studio preview. Every cosmetic on this page is a made-up example; real
     ones come later from the Cosmetics plugin's learning. three.js from jsDelivr (pinned),
     textures from replay/ (the replay viewer's 1.8 assets). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self' data: blob: https://resources.download.minecraft.net; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<title>Prism Cosmetics</title>
<link rel="icon" href="icons/icon-192.png">
<script>
  // Same theme as the tracker site, with its fonts.
  (function () {
    var FONTS = {
      prism: 'family=Manrope:wght@400;500;600;700;800',
      neon: 'family=Manrope:wght@400;500;600;700;800',
      casefiles: 'family=Courier+Prime:wght@400;700&family=Anton',
      ledger: 'family=EB+Garamond:wght@400;600&family=Playfair+Display:wght@600;700',
      deepcurrent: 'family=Sora:wght@400;500;600;700&family=Chakra+Petch:wght@600;700',
      skyisles: 'family=Jersey+10&family=Silkscreen:wght@400;700',
      harvest: 'family=Bitter:wght@400;600;700&family=Ultra'
    }
    var theme = 'prism'
    try { theme = localStorage.getItem('siteTheme') || 'prism' } catch (e) {}
    var q = /[?&]theme=([a-z]+)/.exec(location.search)
    if (q) theme = q[1]
    if (!FONTS[theme]) theme = 'prism'
    document.documentElement.setAttribute('data-theme', theme)
    var link = document.createElement('link')
    link.rel = 'stylesheet'
    link.href = 'https://fonts.googleapis.com/css2?' + FONTS[theme] + '&display=swap'
    document.head.appendChild(link)
  })()
</script>
<style>
  :root {
    --bg: #04050a; --panel: #12151f; --panel-2: #1a1f2d; --border: rgba(255,255,255,0.08); --border-strong: rgba(0,217,255,0.4);
    --accent: #00d9ff; --accent-2: #a855f7; --accent-ink: #031018; --text: #eef0f6; --dim: #8f98ab; --faint: #6c7486;
    --good: #34e0a1; --bad: #ff5c72; --gold: #ffd166;
    --glass: rgba(14,17,26,0.72); --glass-2: rgba(26,31,45,0.85); --glass-line: rgba(255,255,255,0.09);
    --r-s: 8px; --r-m: 14px; --r-l: 20px;
    --shadow: 0 12px 34px rgba(0,0,0,0.45);
    --font: 'Manrope', 'Segoe UI', system-ui, sans-serif; --font-title: var(--font);
    --ease: cubic-bezier(.22,.85,.32,1);
    --glow: 0 0 0 1px rgba(0,217,255,0.35), 0 0 18px rgba(0,217,255,0.25);
    --stage-dark: 1;
    color-scheme: dark;
  }
  html[data-theme="casefiles"] { --bg: #efe6cc; --panel: #fbf6e6; --panel-2: #f2e9cf; --border: #c9b98a; --border-strong: #a3915c; --accent: #2e4a5c; --accent-2: #a32f1d; --accent-ink: #fbf6e6; --text: #2a241c; --dim: #5c5340; --faint: #7a705a; --good: #2e6b46; --bad: #a32f1d; --gold: #b8912f; --glass: rgba(251,246,230,0.9); --glass-2: rgba(242,233,207,0.95); --glass-line: #c9b98a; --r-s: 3px; --r-m: 4px; --r-l: 6px; --shadow: 0 10px 18px -8px rgba(42,36,28,0.45); --font: 'Courier Prime', 'Courier New', monospace; --font-title: 'Anton', Impact, sans-serif; --glow: 0 0 0 2px #2e4a5c; color-scheme: light; }
  html[data-theme="ledger"] { --bg: #ffffff; --panel: #fdfdfc; --panel-2: #f6f4ee; --border: #dcd6c6; --border-strong: #c9bf9e; --accent: #a9822e; --accent-2: #16233a; --accent-ink: #ffffff; --text: #16233a; --dim: #5c6678; --faint: #7a8090; --good: #3a6b4a; --bad: #8a1f2b; --gold: #a9822e; --glass: rgba(253,253,252,0.92); --glass-2: rgba(246,244,238,0.96); --glass-line: #dcd6c6; --r-s: 2px; --r-m: 2px; --r-l: 3px; --shadow: 0 14px 30px -18px rgba(22,35,58,0.35); --font: 'EB Garamond', Georgia, serif; --font-title: 'Playfair Display', Georgia, serif; --glow: 0 0 0 2px #a9822e; color-scheme: light; }
  html[data-theme="deepcurrent"] { --bg: #030c14; --panel: #0a2130; --panel-2: #0e2a3c; --border: rgba(255,255,255,0.08); --border-strong: rgba(53,230,196,0.4); --accent: #35e6c4; --accent-2: #9b6bff; --accent-ink: #021614; --text: #e6f6f4; --dim: #82a9ae; --faint: #648086; --good: #3fd68a; --bad: #ff5a5a; --gold: #c99a4a; --glass: rgba(6,24,36,0.74); --glass-2: rgba(14,42,60,0.88); --glass-line: rgba(53,230,196,0.16); --r-s: 10px; --r-m: 16px; --r-l: 20px; --font: 'Sora', 'Segoe UI', sans-serif; --font-title: 'Chakra Petch', 'Sora', sans-serif; --glow: 0 0 0 1px rgba(53,230,196,0.45), 0 0 18px rgba(53,230,196,0.25); }
  html[data-theme="skyisles"] { --bg: #8fd0ff; --panel: #fbfdf5; --panel-2: #eef6fb; --border: #c3d6e3; --border-strong: #2d6a9f; --accent: #3f9a26; --accent-2: #2d6a9f; --accent-ink: #ffffff; --text: #173247; --dim: #4b6a82; --faint: #6c8294; --good: #2e8f2a; --bad: #d23a2e; --gold: #c98a0b; --glass: rgba(251,253,245,0.93); --glass-2: rgba(238,246,251,0.97); --glass-line: #173247; --r-s: 0px; --r-m: 0px; --r-l: 0px; --shadow: 4px 4px 0 rgba(23,50,71,0.28); --font: 'Jersey 10', 'Silkscreen', monospace; --font-title: 'Silkscreen', monospace; --glow: 0 0 0 2px #173247; color-scheme: light; }
  html[data-theme="skyisles"] body { font-size: 17px; }
  html[data-theme="harvest"] { --bg: #e7c99a; --panel: #fbf3e2; --panel-2: #f4e8cf; --border: rgba(91,58,34,0.2); --border-strong: rgba(168,50,43,0.45); --accent: #a8322b; --accent-2: #c98a1c; --accent-ink: #fbf3e2; --text: #3b2414; --dim: #6e5038; --faint: #8e7055; --good: #4f7a32; --bad: #b3261e; --gold: #c98a1c; --glass: rgba(251,243,226,0.93); --glass-2: rgba(244,232,207,0.97); --glass-line: rgba(91,58,34,0.25); --r-s: 3px; --r-m: 5px; --r-l: 7px; --shadow: 0 16px 30px -16px rgba(59,36,20,0.55); --font: 'Bitter', Georgia, serif; --font-title: 'Ultra', Georgia, serif; --glow: 0 0 0 2px #a8322b; color-scheme: light; }
  /* Prism (the default theme): dark glass lit by a split beam. */
  html[data-theme="prism"] { --bg: #06070b; --panel: #10121a; --panel-2: #171a26; --border: rgba(255,255,255,0.075); --border-strong: rgba(169,139,255,0.45); --accent: #5ee7ff; --accent-2: #a98bff; --accent-ink: #06121a; --text: #eef1f8; --dim: #959cb0; --faint: #6f7689; --good: #4be3a8; --bad: #ff6b81; --gold: #ffc46b; --glass: rgba(14,16,24,0.72); --glass-2: rgba(24,27,39,0.86); --glass-line: rgba(255,255,255,0.09); --r-s: 10px; --r-m: 16px; --r-l: 22px; --shadow: 0 24px 48px -24px rgba(0,0,0,0.85); --glow: 0 0 0 1px rgba(169,139,255,0.45), -8px 0 22px -12px rgba(94,231,255,0.6), 8px 0 22px -12px rgba(255,196,107,0.5); }
  html[data-theme="prism"] body { background: radial-gradient(120% 60% at 50% -10%, #10131f, #06070b 60%) fixed; }
  html[data-theme="prism"] .hero h1 span { background-image: linear-gradient(90deg, #5ee7ff, #a98bff 55%, #ffc46b); }

  /* The studio (where previews render) is the same dark "light box" in every theme,
     tinted with the theme's accent, so particles read the same everywhere. */
  :root { --studio-a: #1b2233; --studio-b: #07090f; }
  html[data-theme="casefiles"] { --studio-a: #3a3a33; --studio-b: #16150f; }
  html[data-theme="ledger"] { --studio-a: #26324a; --studio-b: #0d1422; }
  html[data-theme="deepcurrent"] { --studio-a: #0f3a4a; --studio-b: #020b12; }
  html[data-theme="skyisles"] { --studio-a: #2d6a9f; --studio-b: #123552; }
  html[data-theme="harvest"] { --studio-a: #4a2b1a; --studio-b: #1c0f08; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .page { max-width: 1320px; margin: 0 auto; padding: 22px 24px 60px; }

  /* Header */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--dim); font-size: 14px; padding: 6px 10px 6px 6px; border-radius: var(--r-s); }
  .back:hover { color: var(--text); background: var(--panel); }
  .back svg { width: 16px; height: 16px; }
  .proto { margin-left: auto; font-size: 12px; color: var(--dim); border: 1px dashed var(--border-strong); padding: 5px 10px; border-radius: 999px; }
  html[data-theme="skyisles"] .proto, html[data-theme="ledger"] .proto { border-radius: var(--r-s); }

  .hero { margin: 26px 0 22px; display: grid; grid-template-columns: 1fr minmax(280px, 460px); gap: 24px; align-items: end; }
  .hero h1 { font-family: var(--font-title); font-size: clamp(34px, 5vw, 56px); line-height: 1; margin: 0; letter-spacing: -0.02em; }
  html[data-theme="casefiles"] .hero h1 { font-weight: 400; letter-spacing: 0.03em; text-transform: uppercase; }
  html[data-theme="skyisles"] .hero h1 { letter-spacing: 0; font-size: clamp(28px, 4vw, 44px); }
  .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tally { margin: 10px 0 0; color: var(--dim); font-size: 15px; }
  .tally b { color: var(--text); font-weight: 700; }

  .proto:empty { display: none; }
  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search input { width: 100%; padding: 14px 44px 14px 42px; border-radius: var(--r-m); border: 1px solid var(--border); background: var(--panel); font-size: 16px; transition: border-color .2s, box-shadow .2s; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: none; border-color: var(--border-strong); box-shadow: var(--glow); }
  .search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 12px/1 var(--font); color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 4px 7px; }
  .search input:not(:placeholder-shown) ~ kbd { display: none; }

  /* Body: category rail + results */
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
  .rail { position: sticky; top: 18px; display: flex; flex-direction: column; gap: 2px; }
  .rail-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px 10px; }
  .cat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: var(--r-s); cursor: pointer; color: var(--dim); font-size: 14.5px; transition: background .15s, color .15s; }
  .cat:hover { background: var(--panel); color: var(--text); }
  .cat[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  .cat .ic { width: 20px; height: 20px; flex: none; color: var(--accent); opacity: .85; }
  .cat .n { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .bar h2 { margin: 0 auto 0 0; font-family: var(--font-title); font-size: 22px; font-weight: 700; }
  html[data-theme="casefiles"] .bar h2 { font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  html[data-theme="skyisles"] .seg, html[data-theme="ledger"] .seg, html[data-theme="casefiles"] .seg { border-radius: var(--r-s); }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--dim); cursor: pointer; }
  html[data-theme="skyisles"] .seg button, html[data-theme="ledger"] .seg button, html[data-theme="casefiles"] .seg button { border-radius: var(--r-s); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .sort { padding: 7px 10px; border-radius: var(--r-s); border: 1px solid var(--border); background: var(--panel); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 16px; }
  .card { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--border); border-radius: var(--r-m); background: var(--panel); overflow: hidden; cursor: pointer; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .2s; animation: rise .5s var(--ease) both; }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--border-strong); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .thumb { position: relative; aspect-ratio: 4 / 3; background: radial-gradient(120% 90% at 50% 30%, var(--studio-a), var(--studio-b)); overflow: hidden; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s, transform .6s var(--ease); }
  .thumb img.on { opacity: 1; }
  .card:hover .thumb img { transform: scale(1.06); }
  .thumb .chat-thumb { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px; }
  .shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.06) 50%, transparent 70%); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .rar { position: absolute; left: 10px; top: 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; color: #fff; background: rgba(0,0,0,.42); backdrop-filter: blur(4px); }
  html[data-theme="skyisles"] .rar, html[data-theme="ledger"] .rar { border-radius: 0; }
  .rar::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--rc); box-shadow: 0 0 8px var(--rc); }
  .meta { padding: 11px 13px 13px; display: grid; gap: 3px; }
  .meta .nm { font-weight: 700; font-size: 15.5px; color: var(--text); }
  .meta .sub { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); }
  .st { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12px; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.sure { color: var(--good); } .st.maybe { color: var(--gold); } .st.unseen { color: var(--faint); }
  .st.unseen::before { background: none; border: 1.5px solid currentColor; width: 5px; height: 5px; }

  .empty { padding: 60px 20px; text-align: center; color: var(--dim); border: 1px dashed var(--border); border-radius: var(--r-l); }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  /* Studio (preview) */
  .studio { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 3vh 3vw; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); opacity: 0; transition: opacity .3s; }
  .studio.open { opacity: 1; }
  .sheet { position: relative; width: min(1240px, 100%); height: min(760px, 94vh); display: grid; grid-template-columns: 1fr 360px; border-radius: var(--r-l); overflow: hidden; background: var(--panel); border: 1px solid var(--glass-line); box-shadow: 0 30px 80px rgba(0,0,0,.5); transform: translateY(16px) scale(.98); transition: transform .45s var(--ease); }
  .studio.open .sheet { transform: none; }
  .stage { position: relative; background: radial-gradient(90% 80% at 50% 38%, var(--studio-a), var(--studio-b)); overflow: hidden; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .stage .chat-stage { position: absolute; left: 6%; right: 6%; bottom: 16%; display: grid; gap: 8px; }
  .chat-line { font: 600 15px/1.35 'Courier New', monospace; color: #fff; background: rgba(0,0,0,.45); padding: 4px 8px; width: fit-content; max-width: 100%; text-shadow: 2px 2px 0 rgba(0,0,0,.6); animation: chatin .45s var(--ease) both; }
  .thumb .chat-line { font-size: 10.5px; padding: 3px 6px; }
  @keyframes chatin { from { opacity: 0; transform: translateX(-10px); } }
  .c-red { color: #ff5555; } .c-blue { color: #5555ff; } .c-gray { color: #aaaaaa; } .c-bold { font-weight: 800; } .c-aqua { color: #55ffff; } .c-gold { color: #ffaa00; } .c-yellow { color: #ffff55; } .c-italic { font-style: italic; }
  .unseen-note { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.5); color: #dfe3ea; font-size: 13px; white-space: nowrap; }
  .tools { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px; }
  .tool { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(10,12,18,.55); color: #e9edf5; font-size: 12.5px; cursor: pointer; backdrop-filter: blur(6px); }
  html[data-theme="skyisles"] .tool, html[data-theme="ledger"] .tool { border-radius: 0; }
  .tool:hover { background: rgba(10,12,18,.8); }
  .tool[aria-pressed="true"] { border-color: var(--accent); color: #fff; }
  .tool svg { width: 15px; height: 15px; }
  @media (max-width: 640px) { .tools { gap: 5px; left: 10px; bottom: 10px; } .tool { padding: 0 10px; height: 32px; } .tool span { display: none; } }
  .hint { position: absolute; right: 16px; bottom: 20px; font-size: 12px; color: rgba(230,235,245,.55); pointer-events: none; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(10,12,18,.45); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .nav.prev { left: 14px; } .nav.next { right: 14px; }
  .nav:hover { background: rgba(10,12,18,.8); }

  .info { display: flex; flex-direction: column; gap: 18px; padding: 26px 24px; overflow-y: auto; }
  .close { position: absolute; right: 12px; top: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); cursor: pointer; display: grid; place-items: center; }
  .close svg { width: 16px; height: 16px; }
  .eyebrow { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--dim); }
  .info h3 { margin: 6px 0 0; font-family: var(--font-title); font-size: 30px; line-height: 1.1; }
  html[data-theme="casefiles"] .info h3 { font-weight: 400; text-transform: uppercase; letter-spacing: .02em; }
  .desc { margin: 0; color: var(--dim); line-height: 1.55; font-size: 14.5px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fact { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-s); padding: 10px 12px; }
  .fact .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .fact .v { margin-top: 3px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .block-h { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .how { margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 14px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); }
  html[data-theme="skyisles"] .chip, html[data-theme="ledger"] .chip { border-radius: 0; }
  .wave { width: 100%; height: 56px; display: block; border-radius: var(--r-s); background: var(--panel-2); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 14px; border-radius: var(--r-s); border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; font-size: 13.5px; font-weight: 600; }

function matches(it, q) {

    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

}

function closeStudio() {
  const el = $("studio"); el.classList.remove("open");
  cancelAnimationFrame(raf); stopSounds(); document.body.style.overflow = "";
  setTimeout(() => { el.hidden = true; }, 250);
  history.replaceState(null, "", location.pathname + location.search);
}
function step(d) {
  const list = visible.length ? visible : ITEMS;
  const i = list.findIndex((x) => x.id === current.id);
  openStudio(list[(i + d + list.length) % list.length].id);
}
$("closeBtn").onclick = closeStudio;
$("studio").addEventListener("click", (e) => { if (e.target.id === "studio") closeStudio(); });
$("prevBtn").onclick = () => step(-1); $("nextBtn").onclick = () => step(1);
$("replayBtn").onclick = () => { if (current.lines) return; stopSounds(); studio.load(studio.def); };
$("slowBtn").onclick = (e) => { speed = speed === 1 ? .25 : 1; e.currentTarget.setAttribute("aria-pressed", String(speed !== 1)); };
$("spinBtn").onclick = (e) => { spin = !spin; controls.autoRotate = spin; e.currentTarget.setAttribute("aria-pressed", String(spin)); };
$("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(location.href); $("copyBtn").textContent = "Copied"; setTimeout(() => { $("copyBtn").textContent = "Copy link"; }, 1400); } catch (e) {} };
$("playSound").onclick = () => { if (!current?.sound) return; stopSounds(); playCry(current); };
$("muteBtn").onclick = () => { muted = !muted; if (muted) stopSounds(); try { localStorage.setItem("cosmeticsMuted", muted ? "1" : ""); } catch (e) {} syncMute(); };
function syncMute() { const b = $("muteBtn"); b.setAttribute("aria-pressed", String(!muted)); b.querySelector("span").textContent = muted ? "Sound off" : "Sound on"; b.querySelector(".x").style.display = muted ? "" : "none"; b.querySelector(".w").style.display = muted ? "none" : ""; }

/* ------------------------------------------------------------------ sounds
   Real Minecraft 1.8 sounds, fetched from Mojang's asset server by the hashes
   the replay viewer already ships (replay/sounds.json). */
let soundIndex = null, soundGen = 0, muted = false;
try { muted = localStorage.getItem("cosmeticsMuted") === "1"; } catch (e) {}
const liveAudio = new Set(), liveTimers = new Set();
// Stops everything that is playing or waiting to play (switching cosmetic, closing, replaying, next loop).
function stopSounds() {
  soundGen++;
  for (const a of liveAudio) { try { a.pause(); a.removeAttribute("src"); a.load(); } catch (e) {} }
  liveAudio.clear();
  for (const id of liveTimers) clearTimeout(id);
  liveTimers.clear();
  $("playSound").classList.remove("playing");
}
async function mcSound(name, pitch = 1, vol = 1, delay = 0) {
  if (muted) return;
  const gen = soundGen;
  try {
    if (!soundIndex) soundIndex = await fetch("replay/sounds.json").then((r) => r.json());
    if (gen !== soundGen) return;
    const list = soundIndex[name]; if (!list) return;
    const h = list[Math.floor(Math.random() * list.length)];
    const a = new Audio(`https://resources.download.minecraft.net/${h.slice(0, 2)}/${h}`);
    a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
    a.playbackRate = Math.min(2, Math.max(.5, pitch)); a.volume = Math.min(1, vol) * .6;
    liveAudio.add(a); a.addEventListener("ended", () => liveAudio.delete(a));
    const go = () => { if (gen === soundGen) a.play().catch(() => {}); };
    if (delay) { const id = setTimeout(() => { liveTimers.delete(id); go(); }, delay * 1000); liveTimers.add(id); } else go();
    return a;
  } catch (e) {}
}
async function playCry(it, delay = 0) {
  if (!it.sound) return;
  const btn = $("playSound");
  const a = await mcSound(it.sound[0], it.sound[1], it.sound[2] ?? 1, delay);
  if (!a) return;
  a.addEventListener("playing", () => { if (current === it) btn.classList.add("playing"); });
  a.addEventListener("ended", () => btn.classList.remove("playing"));
}

/* ------------------------------------------------------------------ start */
buildRail(); tally(); render(); syncMute();
const deep = location.hash.slice(1);
if (deep && ITEMS.some((i) => i.id === deep)) openStudio(deep, false);
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== current?.id && ITEMS.some((i) => i.id === h)) openStudio(h, false); });
if (!(HOLD >= 0)) makeThumbs(); // checking a moment skips the thumbnails
</script>
