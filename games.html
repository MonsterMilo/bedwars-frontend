<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prism Games</title>
<link rel="icon" href="icons/icon-192.png">
<script>
  // Same theme as the tracker site (Prism, Neon, Case Files, Ledger, Deep Current,
  // Sky Isles, Harvest), with its fonts.
  (function () {
    var FONTS = {
      prism: 'family=Manrope:wght@400;500;600;700;800',
      neon: 'family=Manrope:wght@400;500;600;700;800',
      casefiles: 'family=Courier+Prime:wght@400;700&family=Anton',
      ledger: 'family=EB+Garamond:wght@400;600&family=Playfair+Display:wght@600;700',
      deepcurrent: 'family=Sora:wght@400;500;600;700&family=Chakra+Petch:wght@600;700',
      skyisles: 'family=Jersey+10&family=Silkscreen:wght@400;700',
      harvest: 'family=Bitter:wght@400;600;700&family=Ultra'
    }
    var theme = 'prism'
    try { theme = localStorage.getItem('siteTheme') || 'prism' } catch (e) {}
    var q = /[?&]theme=([a-z]+)/.exec(location.search)
    if (q) theme = q[1]
    if (!FONTS[theme]) theme = 'prism'
    document.documentElement.setAttribute('data-theme', theme)
    var link = document.createElement('link')
    link.rel = 'stylesheet'
    link.href = 'https://fonts.googleapis.com/css2?' + FONTS[theme] + '&display=swap'
    document.head.appendChild(link)
  })()
</script>
<style>
  /* Tokens follow the tracker's themes. */
  :root {
    --bg: #04050a; --panel: #12151f; --panel-2: #1a1f2d; --border: rgba(255,255,255,0.08); --border-strong: rgba(0,217,255,0.4);
    --accent: #00d9ff; --accent-2: #a855f7; --accent-ink: #031018; --text: #eef0f6; --dim: #8f98ab; --faint: #6c7486;
    --good: #34e0a1; --bad: #ff5c72; --gold: #ffd166; --bed: #ffb347;
    --glass: rgba(14,17,26,0.72); --glass-2: rgba(26,31,45,0.85); --glass-line: rgba(255,255,255,0.09);
    --r-s: 8px; --r-m: 14px; --r-l: 20px;
    --shadow: 0 12px 34px rgba(0,0,0,0.45);
    --font: 'Manrope', 'Segoe UI', system-ui, sans-serif; --font-title: var(--font);
    --ease: cubic-bezier(.22,.85,.32,1);
    --glow: 0 0 0 1px rgba(0,217,255,0.35), 0 0 18px rgba(0,217,255,0.25);
  }
  html[data-theme="casefiles"] { --bg: #efe6cc; --panel: #fbf6e6; --panel-2: #f2e9cf; --border: #c9b98a; --border-strong: #a3915c; --accent: #2e4a5c; --accent-2: #a32f1d; --accent-ink: #fbf6e6; --text: #2a241c; --dim: #5c5340; --faint: #7a705a; --good: #2e6b46; --bad: #a32f1d; --gold: #b8912f; --glass: rgba(251,246,230,0.9); --glass-2: rgba(242,233,207,0.95); --glass-line: #c9b98a; --r-s: 3px; --r-m: 4px; --r-l: 6px; --shadow: 0 10px 18px -8px rgba(42,36,28,0.45); --font: 'Courier Prime', 'Courier New', monospace; --font-title: 'Anton', Impact, sans-serif; --glow: 0 0 0 2px #2e4a5c; }
  html[data-theme="ledger"] { --bg: #ffffff; --panel: #fdfdfc; --panel-2: #f6f4ee; --border: #dcd6c6; --border-strong: #c9bf9e; --accent: #a9822e; --accent-2: #16233a; --accent-ink: #ffffff; --text: #16233a; --dim: #5c6678; --faint: #7a8090; --good: #3a6b4a; --bad: #8a1f2b; --gold: #a9822e; --glass: rgba(253,253,252,0.92); --glass-2: rgba(246,244,238,0.96); --glass-line: #dcd6c6; --r-s: 2px; --r-m: 2px; --r-l: 3px; --shadow: 0 14px 30px -18px rgba(22,35,58,0.35); --font: 'EB Garamond', Georgia, serif; --font-title: 'Playfair Display', Georgia, serif; --glow: 0 0 0 2px #a9822e; }
  html[data-theme="deepcurrent"] { --bg: #030c14; --panel: #0a2130; --panel-2: #0e2a3c; --border: rgba(255,255,255,0.08); --border-strong: rgba(53,230,196,0.4); --accent: #35e6c4; --accent-2: #9b6bff; --accent-ink: #021614; --text: #e6f6f4; --dim: #82a9ae; --faint: #648086; --good: #3fd68a; --bad: #ff5a5a; --gold: #c99a4a; --glass: rgba(6,24,36,0.74); --glass-2: rgba(14,42,60,0.88); --glass-line: rgba(53,230,196,0.16); --r-s: 10px; --r-m: 16px; --r-l: 20px; --font: 'Sora', 'Segoe UI', sans-serif; --font-title: 'Chakra Petch', 'Sora', sans-serif; --glow: 0 0 0 1px rgba(53,230,196,0.45), 0 0 18px rgba(53,230,196,0.25); }
  html[data-theme="skyisles"] { --bg: #8fd0ff; --panel: #fbfdf5; --panel-2: #eef6fb; --border: #c3d6e3; --border-strong: #2d6a9f; --accent: #3f9a26; --accent-2: #2d6a9f; --accent-ink: #ffffff; --text: #173247; --dim: #4b6a82; --faint: #6c8294; --good: #2e8f2a; --bad: #d23a2e; --gold: #c98a0b; --glass: rgba(251,253,245,0.93); --glass-2: rgba(238,246,251,0.97); --glass-line: #173247; --r-s: 0px; --r-m: 0px; --r-l: 0px; --shadow: 4px 4px 0 rgba(23,50,71,0.28); --font: 'Jersey 10', 'Silkscreen', monospace; --font-title: 'Silkscreen', monospace; --glow: 0 0 0 2px #173247; }
  html[data-theme="skyisles"] body { font-size: 17px; }
  html[data-theme="harvest"] { --bg: #e7c99a; --panel: #fbf3e2; --panel-2: #f4e8cf; --border: rgba(91,58,34,0.2); --border-strong: rgba(168,50,43,0.45); --accent: #a8322b; --accent-2: #c98a1c; --accent-ink: #fbf3e2; --text: #3b2414; --dim: #6e5038; --faint: #8e7055; --good: #4f7a32; --bad: #b3261e; --gold: #c98a1c; --glass: rgba(251,243,226,0.93); --glass-2: rgba(244,232,207,0.97); --glass-line: rgba(91,58,34,0.25); --r-s: 3px; --r-m: 5px; --r-l: 7px; --shadow: 0 16px 30px -16px rgba(59,36,20,0.55); --font: 'Bitter', Georgia, serif; --font-title: 'Ultra', Georgia, serif; --glow: 0 0 0 2px #a8322b; }
  /* Prism (the default theme): dark glass lit by a split beam. */
  html[data-theme="prism"] { --bg: #06070b; --panel: #10121a; --panel-2: #171a26; --border: rgba(255,255,255,0.075); --border-strong: rgba(169,139,255,0.45); --accent: #5ee7ff; --accent-2: #a98bff; --accent-ink: #06121a; --text: #eef1f8; --dim: #959cb0; --faint: #6f7689; --good: #4be3a8; --bad: #ff6b81; --gold: #ffc46b; --glass: rgba(14,16,24,0.72); --glass-2: rgba(24,27,39,0.86); --glass-line: rgba(255,255,255,0.09); --r-s: 10px; --r-m: 16px; --r-l: 22px; --shadow: 0 24px 48px -24px rgba(0,0,0,0.85); --glow: 0 0 0 1px rgba(169,139,255,0.45), -8px 0 22px -12px rgba(94,231,255,0.6), 8px 0 22px -12px rgba(255,196,107,0.5); }
  html[data-theme="prism"] body { background: radial-gradient(120% 60% at 50% -10%, #10131f, #06070b 60%) fixed; }
  html[data-theme="prism"] .hero h1 span { background-image: linear-gradient(90deg, #5ee7ff, #a98bff 55%, #ffc46b); }
  * { box-sizing: border-box; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  :root { --t-red: #ff5555; --t-blue: #5b7bff; --t-green: #4ade6b; --t-yellow: #f5d742; --t-aqua: #4fe3e3; --t-white: #e8e8e8; --t-pink: #ff6bd5; --t-gray: #9a9a9a; }

  .page { max-width: 1180px; margin: 0 auto; padding: 22px 24px 70px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--dim); font-size: 14px; padding: 6px 10px 6px 6px; border-radius: var(--r-s); border: 0; background: none; }
  .back:hover { color: var(--text); background: var(--panel); }
  .back svg { width: 16px; height: 16px; }

  .hero { margin: 26px 0 22px; display: grid; grid-template-columns: 1fr minmax(280px, 420px); gap: 24px; align-items: end; }
  .hero h1 { font-family: var(--font-title); font-size: clamp(34px, 5vw, 56px); line-height: 1; margin: 0; letter-spacing: -0.02em; }
  html[data-theme="casefiles"] .hero h1 { font-weight: 400; letter-spacing: 0.03em; text-transform: uppercase; }
  html[data-theme="skyisles"] .hero h1 { letter-spacing: 0; font-size: clamp(28px, 4vw, 44px); }
  .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tally { margin: 10px 0 0; color: var(--dim); min-height: 1.2em; }
  .tally b { color: var(--text); }
  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search input { width: 100%; padding: 13px 14px 13px 42px; border-radius: var(--r-m); border: 1px solid var(--border); background: var(--panel); font-size: 16px; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: none; border-color: var(--border-strong); box-shadow: var(--glow); }

  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 13px; border-radius: 999px; font-size: 13.5px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  html[data-theme="skyisles"] .seg, html[data-theme="ledger"] .seg, html[data-theme="casefiles"] .seg, html[data-theme="skyisles"] .seg button, html[data-theme="ledger"] .seg button, html[data-theme="casefiles"] .seg button { border-radius: var(--r-s); }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; cursor: pointer; margin-left: auto; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .note { padding: 14px 16px; border-radius: var(--r-m); background: var(--panel); border: 1px solid var(--border-strong); }
  .note a { color: var(--accent); }

  /* The list */
  .games { display: flex; flex-direction: column; gap: 10px; }
  .game { --res: var(--faint); text-decoration: none; color: inherit; display: grid; grid-template-columns: 6px 150px 1fr auto; align-items: stretch; gap: 0; text-align: left; border: 1px solid var(--border); background: var(--panel); border-radius: var(--r-m); overflow: hidden; padding: 0; transition: border-color .2s, transform .3s var(--ease), box-shadow .3s var(--ease); animation: rise .4s var(--ease) both; }
  .game:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .game.is-win { --res: var(--good); }
  .game.is-loss { --res: var(--bad); }
  .game .stripe { background: var(--res); }
  .game .when { padding: 14px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
  .game .when b { font-size: 15px; }
  .game .when span { color: var(--dim); font-size: 13px; }
  .result { display: inline-block; align-self: flex-start; margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: var(--res); background: color-mix(in srgb, var(--res) 14%, transparent); }
  .game .mid { padding: 12px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .game .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .game .title b { font-family: var(--font-title); font-size: 18px; }
  html[data-theme="casefiles"] .game .title b { font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }
  .game .title span { color: var(--dim); font-size: 13.5px; }
  .watched { font-size: 11px; font-weight: 700; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; }
  .teams { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
  .tm { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); min-width: 0; }
  .tm i { width: 9px; height: 9px; border-radius: 3px; background: var(--tc); flex: none; }
  .tm.is-out { opacity: .5; }
  .tm.is-win { color: var(--text); }
  .tm .me { color: var(--text); font-weight: 700; }
  .game .side { padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 6px; border-left: 1px solid var(--border); min-width: 170px; }
  .nums { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
  .nums div { display: flex; flex-direction: column; align-items: flex-end; }
  .nums b { font-size: 17px; line-height: 1.1; }
  .nums small { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .mini { color: var(--dim); font-size: 12.5px; display: flex; gap: 10px; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 22px; color: var(--dim); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--border); background: var(--panel); border-radius: var(--r-s); padding: 8px 14px; font-weight: 700; text-decoration: none; font-size: 14px; }
  .btn:hover:not(:disabled) { border-color: var(--border-strong); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { box-shadow: var(--glow); }
  .btn svg { width: 16px; height: 16px; }
  .empty { text-align: center; color: var(--dim); padding: 50px 0; }
  .skel { height: 92px; border-radius: var(--r-m); background: linear-gradient(90deg, var(--panel), var(--panel-2), var(--panel)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* One game */
  .g-head { margin: 22px 0 20px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .g-head h1 { margin: 0; font-family: var(--font-title); font-size: clamp(28px, 4vw, 44px); line-height: 1.05; }
  html[data-theme="casefiles"] .g-head h1 { font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }
  .g-head p { margin: 6px 0 0; color: var(--dim); }
  .g-head .result { font-size: 12px; margin: 0 0 8px; }
  .g-head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .g-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .card { border: 1px solid var(--border); background: var(--panel); border-radius: var(--r-l); padding: 16px 18px; }
  .card + .card { margin-top: 18px; }
  .card h2 { margin: 0 0 12px; font-family: var(--font-title); font-size: 18px; display: flex; align-items: baseline; gap: 10px; }
  html[data-theme="casefiles"] .card h2 { font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }
  .card h2 small { font-family: var(--font); font-size: 13px; color: var(--faint); font-weight: 600; }
  .team { --tc: var(--faint); border-radius: var(--r-m); background: var(--panel-2); margin-bottom: 10px; overflow: hidden; }
  .team-head { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-left: 4px solid var(--tc); }
  .team-head b { color: var(--tc); text-transform: uppercase; letter-spacing: .05em; font-size: 14px; }
  html[data-theme="casefiles"] .team-head b, html[data-theme="ledger"] .team-head b, html[data-theme="skyisles"] .team-head b, html[data-theme="harvest"] .team-head b { color: var(--text); }
  .team-head .crown { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .team-head .bed { margin-left: auto; font-size: 12.5px; color: var(--dim); }
  .team-head .bed.gone { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; text-align: right; padding: 4px 8px; }
  th:first-child, td:first-child { text-align: left; padding-left: 14px; }
  td { padding: 6px 8px; text-align: right; border-top: 1px solid var(--border); }
  td .nm { font-weight: 700; }
  td .nm.is-out { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 70%, transparent); color: var(--dim); }
  td .you { font-size: 10.5px; font-weight: 800; color: var(--accent); margin-left: 6px; letter-spacing: .06em; }
  td .pov { font-size: 12px; color: var(--dim); text-decoration: none; margin-left: 8px; opacity: 0; transition: opacity .15s; }
  tr:hover td .pov { opacity: 1; }
  td .pov:hover { color: var(--accent); }
  td.z { color: var(--faint); }
  .log { list-style: none; margin: 0; padding: 0; max-height: 560px; overflow-y: auto; scrollbar-width: thin; }
  .log li a { display: grid; grid-template-columns: 52px 14px 1fr; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r-s); text-decoration: none; font-size: 14px; }
  .log li a:hover { background: var(--panel-2); }
  .log time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 13px; }
  .log i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); align-self: center; }
  .log .k-final i { background: var(--bad); }
  .log .k-bed i { background: var(--bed); border-radius: 2px; transform: rotate(45deg); }
  .log .k-eliminated i { background: var(--accent-2); }
  .log .k-left i { background: transparent; border: 1.5px solid var(--faint); }
  .log .who { font-weight: 700; color: var(--pc, var(--text)); }
  .log .fb { font-size: 10.5px; font-weight: 800; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; margin-left: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: transparent; color: var(--dim); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
  .chip[aria-pressed="true"] { background: var(--panel-2); color: var(--text); border-color: var(--border-strong); }
  .clips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .clips a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-s); background: var(--panel-2); text-decoration: none; font-size: 14px; }
  .clips a:hover { box-shadow: inset 0 0 0 1px var(--border-strong); }
  .clips .k { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); min-width: 56px; }
  .clips .k.bed { color: var(--bed); } .clips .k.final { color: var(--bad); }
  .clips span:last-child { margin-left: auto; color: var(--faint); font-size: 12.5px; white-space: nowrap; }
  .ms table td, .ms table th { padding-left: 6px; padding-right: 6px; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .game { grid-template-columns: 6px 1fr; }
    .game .when { border-right: 0; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .game .when, .game .mid, .game .side { grid-column: 2; }
    .game .side { border-left: 0; border-top: 1px solid var(--border); align-items: flex-start; }
    .g-grid { grid-template-columns: 1fr; }
    .check { margin-left: 0; }
    td .pov { opacity: 1; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="back" id="back" href="./"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="backText">Prism</span></a>
  </header>

  <section id="listView">
    <div class="hero">
      <div>
        <h1>Prism <span>Games</span></h1>
        <p class="tally" id="tally"></p>
      </div>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search a player, map or mode" autocomplete="off" aria-label="Search games">
      </label>
    </div>
    <div class="bar">
      <div class="seg" id="resSeg" role="group" aria-label="Result">
        <button type="button" data-r="all" aria-pressed="true">All</button>
        <button type="button" data-r="win" aria-pressed="false">Wins</button>
        <button type="button" data-r="loss" aria-pressed="false">Losses</button>
      </div>
      <label class="check"><input type="checkbox" id="hideWatched"> Hide games I've watched</label>
    </div>
    <div class="games" id="games"></div>
    <div class="pager" id="pager" hidden>
      <button type="button" class="btn" id="prev">Newer</button>
      <span id="pageInfo"></span>
      <button type="button" class="btn" id="next">Older</button>
    </div>
  </section>

  <section id="gameView" hidden></section>
</div>

<script>
(function () {
  var API = 'https://bedwars-backend.onrender.com';
  var KEY = ''; try { KEY = localStorage.getItem('bedwarsAdminKey') || ''; } catch (e) {}
  var TEAM = { Red: '--t-red', Blue: '--t-blue', Green: '--t-green', Yellow: '--t-yellow', Aqua: '--t-aqua', White: '--t-white', Pink: '--t-pink', Gray: '--t-gray', Grey: '--t-gray' };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tc(team) { return 'var(' + (TEAM[team] || '--faint') + ')'; }
  function clock(ms) { ms = Math.max(0, ms || 0); var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function mins(ms) { var m = Math.round((ms || 0) / 60000); return m + ' min'; }
  function when(d) { var t = new Date(d); return isNaN(t) ? '' : t.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
  function time(d) { var t = new Date(d); return isNaN(t) ? '' : t.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }
  function modeName(m) { return String(m || '').replace(/^BEDWARS_/, '').replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function api(path) {
    return fetch(API + path, { headers: { 'x-admin-key': KEY } }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('The server answered ' + r.status)); return j; });
    });
  }
  var watched = {}; try { watched = JSON.parse(localStorage.getItem('gamesWatched')) || {}; } catch (e) {}
  function markWatched(id) { watched[id] = Date.now(); try { localStorage.setItem('gamesWatched', JSON.stringify(watched)); } catch (e) {} }
  function isWatched(g) { return (g.replayIds || [g.id]).some(function (id) { return watched[id]; }); }
  // Replay viewer links: to a time (ms into the replay) and a player.
  function watchUrl(id, t, name) {
    var h = [];
    if (t != null) h.push('t=' + (Math.max(0, t) / 1000).toFixed(1));
    if (name) h.push('p=' + encodeURIComponent(name), 'm=follow');
    return 'replay.html?id=' + encodeURIComponent(id) + (h.length ? '#' + h.join('&') : '');
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-watch]');
    if (a) markWatched(a.getAttribute('data-watch'));
  });

  if (!KEY) {
    $('games').innerHTML = '<div class="note">Games need your tracker key. Open the <a href="tracker.html">tracker</a>, enter your key there, then come back.</div>';
    $('tally').textContent = '';
    return;
  }

  // ---------- The list ----------
  var state = { page: 1, q: '', res: 'all', pages: 1 };
  try { $('hideWatched').checked = localStorage.getItem('gamesHideWatched') === '1'; } catch (e) {}
  var last = null;
  function loadList() {
    $('games').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    var q = state.q;
    api('/games?page=' + state.page + (q ? '&q=' + encodeURIComponent(q) : '')).then(function (j) {
      if (q !== state.q) return;
      last = j; state.pages = j.pages || 1;
      $('tally').innerHTML = '<b>' + j.total + '</b> game' + (j.total === 1 ? '' : 's') + (q ? ' with “' + esc(q) + '”' : ' recorded');
      renderList();
    }).catch(function (err) {
      $('games').innerHTML = '<div class="note">Couldn’t load the games: ' + esc(err.message) + '. The server may be waking up, try again in a minute.</div>';
    });
  }
  function teamsLine(g) {
    var s = g.summary;
    if (!s || !s.teams) return '';
    return '<div class="teams">' + s.teams.map(function (t) {
      var out = t.eliminatedAt != null && s.winner !== t.team;
      var names = t.players.map(function (n) { return s.self && n === s.self.name ? '<span class="me">' + esc(n) + '</span>' : esc(n); }).join(', ');
      return '<span class="tm' + (out ? ' is-out' : '') + (s.winner === t.team ? ' is-win' : '') + '" style="--tc:' + tc(t.team) + '" title="' + esc(t.team) + (s.winner === t.team ? ' won' : out ? ' was eliminated' : '') + '"><i></i>' + names + '</span>';
    }).join('') + '</div>';
  }
  function renderList() {
    if (!last) return;
    var hide = $('hideWatched').checked;
    var list = last.games.filter(function (g) {
      if (hide && isWatched(g)) return false;
      if (state.res !== 'all' && g.result !== state.res) return false;
      return true;
    });
    var box = $('games');
    if (!list.length) box.innerHTML = '<div class="empty">' + (last.games.length ? 'No games on this page match. Try another page or filter.' : 'No games yet. Recorded games show up here once they’re uploaded.') + '</div>';
    else box.innerHTML = list.map(function (g, i) {
      var s = g.summary || {};
      var tot = s.totals || {};
      var res = g.result === 'win' ? 'is-win' : g.result === 'loss' ? 'is-loss' : '';
      return '<a class="game ' + res + '" href="#g=' + esc(g.id) + '" style="animation-delay:' + (i * 25) + 'ms">' +
        '<span class="stripe"></span>' +
        '<div class="when"><b>' + esc(when(g.playedAt)) + '</b><span>' + esc(time(g.playedAt)) + ' · ' + esc(mins(g.durationMs)) + '</span>' + (g.result ? '<span class="result">' + (g.result === 'win' ? 'Win' : 'Loss') + '</span>' : '') + '</div>' +
        '<div class="mid"><div class="title"><b>' + esc(g.map || 'Unknown map') + '</b><span>' + esc(modeName(g.mode)) + '</span>' + (isWatched(g) ? '<span class="watched">Watched</span>' : '') + '</div>' + teamsLine(g) + '</div>' +
        '<div class="side">' + (g.summary ? '<div class="nums"><div><b>' + (tot.kills || 0) + '</b><small>Kills</small></div><div><b>' + (tot.finals || 0) + '</b><small>Finals</small></div><div><b>' + (tot.beds || 0) + '</b><small>Beds</small></div></div>' : '<span class="mini">Summary not ready yet</span>') +
        '<div class="mini">' + (g.clips ? '<span>' + g.clips + ' clip' + (g.clips === 1 ? '' : 's') + '</span>' : '') + (g.matchStats ? '<span>Match stats</span>' : '') + (g.tracked && g.tracked.length ? '<span title="Tracked players in this game">' + esc(g.tracked.map(function (p) { return p.username; }).join(', ')) + '</span>' : '') + '</div></div>' +
        '</a>';
    }).join('');
    $('pager').hidden = state.pages <= 1;
    $('pageInfo').textContent = 'Page ' + state.page + ' of ' + state.pages;
    $('prev').disabled = state.page <= 1;
    $('next').disabled = state.page >= state.pages;
  }
  var qTimer = 0;
  $('q').addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(function () { state.q = $('q').value.trim(); state.page = 1; loadList(); }, 300); });
  $('resSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.res = b.getAttribute('data-r');
    $('resSeg').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    renderList();
  });
  $('hideWatched').addEventListener('change', function () { try { localStorage.setItem('gamesHideWatched', $('hideWatched').checked ? '1' : '0'); } catch (e) {} renderList(); });
  $('prev').addEventListener('click', function () { if (state.page > 1) { state.page--; loadList(); scrollTo(0, 0); } });
  $('next').addEventListener('click', function () { if (state.page < state.pages) { state.page++; loadList(); scrollTo(0, 0); } });

  // ---------- One game ----------
  function loadGame(id) {
    var v = $('gameView');
    v.innerHTML = '<div class="skel" style="height:120px;margin-top:22px"></div>';
    api('/games/' + encodeURIComponent(id)).then(function (g) { renderGame(g); }).catch(function (err) {
      v.innerHTML = '<div class="note" style="margin-top:22px">Couldn’t load this game: ' + esc(err.message) + '</div>';
    });
  }
  function renderGame(g) {
    var v = $('gameView');
    var s = g.summary;
    var id = g.id;
    var start = s && s.startT != null ? s.startT : 0;
    var teamOf = {};
    if (s) s.teams.forEach(function (t) { t.players.forEach(function (p) { teamOf[p.name] = t.team; }); });
    var res = g.result === 'win' ? 'is-win' : g.result === 'loss' ? 'is-loss' : '';
    var html = '<div class="g-head ' + res + '" style="--res:' + (g.result === 'win' ? 'var(--good)' : g.result === 'loss' ? 'var(--bad)' : 'var(--faint)') + '"><div>' +
      (g.result ? '<span class="result">' + (g.result === 'win' ? 'Win' : 'Loss') + (s && s.winner ? ' · ' + esc(s.winner) + ' won' : '') + '</span>' : (s && s.winner ? '<span class="result">' + esc(s.winner) + ' won</span>' : '')) +
      '<h1>' + esc(g.map || 'Unknown map') + '</h1>' +
      '<p>' + esc(modeName(g.mode)) + ' · ' + esc(new Date(g.playedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })) + ' · ' + esc(mins(g.durationMs)) + (s && s.self ? ' · recorded by ' + esc(s.self.name) : '') + '</p></div>' +
      '<div class="acts"><a class="btn primary" data-watch="' + esc(id) + '" href="' + watchUrl(id, start || null) + '"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 001.5.86l12-7.5a1 1 0 000-1.72l-12-7.5A1 1 0 007 4.5z"/></svg>Watch the game</a></div></div>';
    html += '<div class="g-grid"><div>';
    // Teams.
    if (s) {
      html += '<div class="card"><h2>Teams <small>' + s.totals.kills + ' kills · ' + s.totals.finals + ' finals · ' + s.totals.beds + ' beds</small></h2>';
      s.teams.forEach(function (t) {
        var won = s.winner === t.team;
        html += '<div class="team" style="--tc:' + tc(t.team) + '"><div class="team-head"><b>' + esc(t.team) + '</b>' + (won ? '<span class="crown">Won</span>' : '') +
          '<span class="bed' + (t.bedBrokenAt != null ? ' gone' : '') + '">' + (t.bedBrokenAt != null ? 'Bed broken ' + clock(t.bedBrokenAt - start) : 'Bed kept') + (t.eliminatedAt != null && !won ? ' · out ' + clock(t.eliminatedAt - start) : '') + '</span></div>' +
          '<table><thead><tr><th>Player</th><th title="Kills">K</th><th title="Final kills">F</th><th title="Deaths">D</th><th title="Beds broken">Beds</th></tr></thead><tbody>' +
          t.players.map(function (p) {
            var z = function (n) { return '<td' + (n ? '' : ' class="z"') + '>' + (n || 0) + '</td>'; };
            return '<tr><td><span class="nm' + (p.finalDeath ? ' is-out' : '') + '">' + esc(p.name) + '</span>' + (s.self && p.name === s.self.name ? '<span class="you">REC</span>' : '') + '<a class="pov" data-watch="' + esc(id) + '" href="' + watchUrl(id, start || null, p.name) + '" title="Watch the game following ' + esc(p.name) + '">Watch →</a></td>' + z(p.kills) + z(p.finals) + z(p.deaths) + z(p.beds) + '</tr>';
          }).join('') + '</tbody></table></div>';
      });
      html += '</div>';
    } else html += '<div class="card"><h2>Teams</h2><p class="mini">This game’s summary isn’t ready yet. It’s worked out when the game is clipped.</p></div>';
    // Match stats.
    if (g.matchStats && g.matchStats.players && g.matchStats.players.length) {
      var ms = g.matchStats;
      html += '<div class="card ms"><h2>Our match stats' + (ms.team ? ' <small>' + esc(ms.team) + '</small>' : '') + '</h2><table><thead><tr><th>Player</th><th>K</th><th>D</th><th>F</th><th>Beds</th><th>Iron</th><th>Gold</th><th>Dia</th><th>Em</th><th title="Time on an enemy island while their bed was up">Pressure</th></tr></thead><tbody>' +
        ms.players.map(function (p) {
          return '<tr><td><span class="nm' + (p.finalDeath ? ' is-out' : '') + '">' + esc(p.name) + '</span>' + (p.me ? '<span class="you">YOU</span>' : '') + '</td><td>' + p.kills + '</td><td>' + p.deaths + '</td><td>' + p.finals + '</td><td>' + p.beds + '</td><td>' + p.iron + '</td><td>' + p.gold + '</td><td>' + p.dia + '</td><td>' + p.em + '</td><td>' + clock(p.pressureMs) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    // Clips.
    html += '<div class="card"><h2>Clips <small>' + g.clips.length + '</small></h2>';
    if (!g.clips.length) html += '<p class="mini">No clips from this game. Mark one in the replay viewer’s Clips tab.</p>';
    else html += '<ul class="clips">' + g.clips.map(function (c) {
      var k = c.kind === 'bed' ? 'Bed' : c.kind === 'final' ? 'Final' : 'Clip';
      var text = c.title || (c.kind === 'manual' ? (c.people || []).slice(0, 3).join(', ') : (c.victim || '') + (c.by ? ' by ' + c.by : ''));
      return '<li><a href="replay.html?clip=' + encodeURIComponent(c.id) + '"><span class="k ' + esc(c.kind) + '">' + k + '</span><span>' + esc(text || 'Clip') + '</span><span>' + Math.round((c.durationMs || 0) / 1000) + ' s</span></a></li>';
    }).join('') + '</ul>';
    html += '</div></div>';
    // Kill log.
    html += '<div>';
    if (s && s.events && s.events.length) {
      html += '<div class="card"><h2>What happened <small>' + s.events.length + ' events</small></h2><div class="filters" id="logFilters">' +
        [['all', 'All'], ['final', 'Finals'], ['bed', 'Beds'], ['kill', 'Kills'], ['eliminated', 'Teams out']].map(function (f, i) { return '<button type="button" class="chip" data-f="' + f[0] + '" aria-pressed="' + (i === 0) + '">' + f[1] + '</button>'; }).join('') +
        '</div><ul class="log" id="log">' + s.events.map(function (e) {
          var who = e.kind === 'bed' ? (e.by || '?') : e.kind === 'eliminated' ? e.team : e.victim;
          var text;
          if (e.kind === 'bed') text = '<span class="who" style="--pc:' + tc(e.byTeam) + '">' + esc(e.by || '?') + '</span> broke <b style="color:' + tc(e.team) + '">' + esc(e.team) + '</b>’s bed';
          else if (e.kind === 'eliminated') text = '<b style="color:' + tc(e.team) + '">' + esc(e.team) + '</b> is out';
          else if (e.kind === 'left') text = '<span class="who" style="--pc:' + tc(e.team) + '">' + esc(e.victim) + '</span> left the game';
          else text = (e.by ? '<span class="who" style="--pc:' + tc(e.byTeam) + '">' + esc(e.by) + '</span> ' + (e.kind === 'final' ? 'final killed' : 'killed') + ' ' : '') + '<span class="who" style="--pc:' + tc(e.team) + '">' + esc(e.victim) + '</span>' + (e.by ? '' : (e.kind === 'final' ? ' died for good' : ' died')) + (e.firstBlood ? '<span class="fb">First blood</span>' : '');
          var follow = e.kind === 'bed' ? e.by : e.by || e.victim;
          return '<li class="k-' + esc(e.kind) + '" data-k="' + esc(e.kind) + '"><a data-watch="' + esc(id) + '" href="' + watchUrl(id, e.t - 5000, follow || who) + '" title="' + esc(e.text || '') + '"><time>' + clock(e.t - start) + '</time><i></i><span>' + text + '</span></a></li>';
        }).join('') + '</ul></div>';
    } else if (s) html += '<div class="card"><h2>What happened</h2><p class="mini">No kills or beds were seen in this recording.</p></div>';
    html += '</div></div>';
    v.innerHTML = html;
    var lf = $('logFilters');
    if (lf) lf.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var f = b.getAttribute('data-f');
      lf.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('log').querySelectorAll('li').forEach(function (li) { li.hidden = f !== 'all' && li.getAttribute('data-k') !== f; });
    });
    document.title = (g.map || 'Game') + ' · Prism Games';
  }

  // ---------- Routing: #g=<id> is one game ----------
  function route() {
    var m = /^#g=([0-9a-f]{24})$/.exec(location.hash);
    $('listView').hidden = !!m;
    $('gameView').hidden = !m;
    $('backText').textContent = m ? 'All games' : 'Prism';
    $('back').setAttribute('href', m ? '#' : './');
    if (m) { loadGame(m[1]); scrollTo(0, 0); } else { document.title = 'Prism Games'; if (!last) loadList(); else renderList(); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
