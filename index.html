<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Prism home page. One three.js scene behind the page draws the background, the light beams
     and the glass prism (real refraction + bloom). The cards are normal HTML on top.
     To add a page, add one entry to PAGES below: it gets a card and its own beam.
     If WebGL or three.js can't load, a flat 2D version of the beams is drawn instead.
     Old tracker links (anything with ?query or #hash) are sent on to tracker.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://mc-heads.net; connect-src 'self' https://bedwars-backend.onrender.com https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<script>
  // The tracker used to live here. Its links carry ?player=, ?lb= or #section, so pass those on.
  if (location.search || (location.hash && location.hash !== '#')) location.replace('tracker.html' + location.search + location.hash);
</script>
<title>Prism</title>
<meta name="description" content="Prism: the Bed Wars tracker, cosmetics library and map atlas.">
<meta name="theme-color" content="#04050a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one screen. Wordmark + prism on the left, a column of page cards on the right,
     beams joining them. Everything scales with the window so big screens don't look shrunk.
     Phones: prism on top, cards stacked below. */
  :root {
    --bg: #04050a; --panel: rgba(16,19,30,0.72); --panel-solid: #10131e; --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
    --text: #eef0f6; --dim: #9aa2b5; --faint: #6c7486;
    --cyan: #00d9ff; --violet: #a855f7; --gold: #ffb84d;
    --font: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(.22,.85,.32,1);
    --gutter: max(16px, min(5vw, 72px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  main { position: relative; min-height: 100%; display: flex; flex-direction: column; isolation: isolate; }
  #scene, #flat { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  #flat { pointer-events: none; }
  #scene { opacity: 0; transition: opacity 1.2s ease; }
  #scene.on { opacity: 1; }

  .wrap { width: 100%; max-width: 1760px; margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }

  .topbar { display: flex; align-items: center; gap: 18px; padding-block: max(22px, env(safe-area-inset-top, 0px)) 0; }
  .mark { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .01em; font-size: clamp(17px, 1.1vw, 20px); }
  .mark svg { width: 1.5em; height: 1.5em; }
  .topbar nav { margin-left: auto; display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: clamp(13px, .85vw, 15px); font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.02); transition: color .2s, border-color .2s, background .2s; }
  .pill:hover { color: var(--text); border-color: var(--line-2); background: rgba(255,255,255,0.05); }

  .hero { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, clamp(520px, 37vw, 720px)); gap: clamp(32px, 5vw, 120px); align-items: center; padding-block: clamp(24px, 4vh, 60px); }
  .hero-left { display: flex; flex-direction: column; gap: clamp(14px, 1.6vh, 22px); }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 600 clamp(11px, .7vw, 13px) var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .eyebrow i { width: 26px; height: 1px; background: linear-gradient(90deg, transparent, var(--dim)); }
  h1 { margin: 0; font-size: clamp(72px, 9.2vw, 184px); line-height: .86; font-weight: 800; letter-spacing: -.045em; }
  .grad { background: linear-gradient(100deg, #ffffff 0%, #bff5ff 22%, var(--cyan) 42%, var(--violet) 70%, var(--gold) 100%); background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 10s ease-in-out infinite alternate; }
  @keyframes sheen { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  .lede { margin: 0; color: var(--dim); font-size: clamp(17px, 1.2vw, 22px); line-height: 1.55; max-width: 32ch; text-wrap: pretty; }
  .prism-spot { height: clamp(240px, 34vh, 420px); margin-top: clamp(0px, 1vh, 16px); }

  .cards { display: flex; flex-direction: column; gap: clamp(14px, 1.6vh, 22px); }
  .card { --c: 0,217,255; position: relative; display: grid; grid-template-columns: clamp(150px, 11vw, 220px) minmax(0, 1fr); gap: clamp(16px, 1.4vw, 26px); align-items: center;
    padding: clamp(12px, .9vw, 16px); padding-right: clamp(18px, 1.6vw, 30px); border-radius: clamp(16px, 1.2vw, 22px);
    background: linear-gradient(180deg, rgba(22,26,40,0.78), rgba(12,14,22,0.78)); border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 24px 50px -30px rgba(0,0,0,0.8);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: transform .5s var(--ease), border-color .3s, box-shadow .4s; animation: cardIn .9s var(--ease) both; }
  .card::before { content: ""; position: absolute; left: -1px; top: 16%; bottom: 16%; width: 2px; border-radius: 2px; background: rgb(var(--c)); box-shadow: 0 0 12px rgb(var(--c)), 0 0 28px rgba(var(--c), .6); }
  .card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: linear-gradient(90deg, rgba(var(--c), .55), rgba(var(--c), 0) 45%) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; border: 1px solid transparent; }
  .card:hover, .card:focus-visible { transform: translateX(-6px); box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 30px 60px -28px rgba(var(--c), .45); }
  .card:hover::after, .card:focus-visible::after { opacity: 1; }
  .thumb { position: relative; aspect-ratio: 16 / 11; border-radius: clamp(10px, .8vw, 14px); overflow: hidden; background: #080a11; box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset; }
  .thumb canvas, .thumb .tlist { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thumb.open { background: none; box-shadow: none; overflow: visible; }
  .card h2 { margin: 0 0 6px; font-size: clamp(20px, 1.45vw, 28px); font-weight: 800; letter-spacing: -.015em; }
  .card p { margin: 0; color: var(--dim); font-size: clamp(14px, .9vw, 16px); line-height: 1.5; text-wrap: pretty; }
  .go { margin-top: clamp(10px, .9vw, 14px); display: inline-flex; align-items: center; gap: 8px; font-size: clamp(13px, .85vw, 15px); font-weight: 700; color: rgb(var(--c)); }
  .go svg { transition: transform .3s var(--ease); }
  .card:hover .go svg { transform: translateX(4px); }

  .foot { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; color: var(--faint); font-size: 13px; padding-block: 18px max(22px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .foot b { color: var(--text); font-variant-numeric: tabular-nums; }
  .foot .live { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .foot .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #34e0a1; box-shadow: 0 0 10px #34e0a1; }
  .foot .by { margin-left: auto; }
  .foot .stat:not([hidden]) ~ .stat:not([hidden])::before { content: ""; display: inline-block; width: 1px; height: 11px; background: var(--line); margin: 0 12px 0 4px; vertical-align: -1px; }

  h1 { animation: rise 1s var(--ease) both; }
  .lede, .eyebrow { animation: rise 1s var(--ease) both; animation-delay: .12s; }
  @keyframes cardIn { from { transform: translateX(28px); opacity: 0.2; } }
  @keyframes rise { from { transform: translateY(16px); opacity: 0.2; } }

  /* Tracker preview: top players, scrolling */
  .tlist { overflow: hidden; font-size: clamp(11px, .72vw, 13px); }
  .tlist ol { list-style: none; margin: 0; padding: 7px; display: flex; flex-direction: column; gap: 4px; transition: transform .7s var(--ease); }
  .tlist li { display: grid; grid-template-columns: 1.6em minmax(0,1fr) auto; align-items: center; gap: 7px; height: 2.05em; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.04); }
  .tlist .av { width: 1.6em; height: 1.6em; border-radius: 4px; image-rendering: pixelated; background: rgba(255,255,255,.06); }
  .tlist .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .tlist .st { font: 700 .92em var(--mono); }
  .tlist li.ghost .nm, .tlist li.ghost .st { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); color: transparent; animation: pulse 1.4s ease-in-out infinite; }
  .tlist li.ghost .nm { width: 70%; } .tlist li.ghost .st { width: 38px; }
  .tlist .msg { position: absolute; inset: auto 0 6px; text-align: center; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  @keyframes pulse { 50% { opacity: .45; } }

  @media (max-width: 980px) {
    .hero { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 18px 36px; }
    .prism-spot { height: clamp(200px, 46vw, 300px); }
    .lede { max-width: 40ch; }
  }
  @media (max-width: 560px) {
    .card { grid-template-columns: 112px minmax(0, 1fr); gap: 14px; }
    .card:hover { transform: none; }
    .card .tlist .av { display: none; }
    .card .tlist li { grid-template-columns: minmax(0,1fr) auto; }
    .foot .by { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="flat" aria-hidden="true"></canvas>
  <div class="wrap">
    <header class="topbar">
      <a class="mark" href="./"><svg viewBox="0 0 26 26" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#9fe9ff"/><stop offset="1" stop-color="#c79bff"/></linearGradient></defs><path d="M13 2.5 23.5 21.5h-21Z" fill="none" stroke="url(#mk)" stroke-width="2" stroke-linejoin="round"/><path d="M13 9.5v12" stroke="#fff" stroke-opacity=".3" stroke-width="1.4"/></svg>Prism</a>
      <nav aria-label="More"><a class="pill" href="hall-of-fame.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3v1a3 3 0 0 1-3 3M7 6H4v1a3 3 0 0 0 3 3"/></svg>Hall of Fame</a></nav>
    </header>
  </div>
  <div class="wrap hero">
    <div class="hero-left">
      <span class="eyebrow"><i></i>Bed Wars, split into colours</span>
      <h1><span class="grad">Prism</span></h1>
      <p class="lede">Track the sweats you queue into. Browse every cosmetic in 3D. Fly over every map in rotation.</p>
      <div class="prism-spot" id="prismSpot"></div>
    </div>
    <nav class="cards" id="cards" aria-label="Prism pages"></nav>
  </div>
  <div class="wrap">
    <footer class="foot"><span class="live" id="tally" hidden><span class="stat" id="tallyP" hidden><b id="tallyN">0</b> players tracked</span><span class="stat" id="tallyC" hidden><b id="tallyCN">0</b> cosmetics</span><span class="stat" id="tallyM" hidden><b id="tallyMN">0</b> maps in the Atlas</span></span><span class="by">Made by Milo</span></footer>
  </div>
</main>

<script>
(function () {
  /* ---------- The pages. Add one entry here to add a card and a beam. ----------
     color: the beam colour (r, g, b). preview: 'players' (live top players), 'cosmetic'
     (spinning sword), 'atlas' (map from above), or leave it out for a card with no picture. */
  var PAGES = [
    { name: 'Prism Tracker', href: 'tracker.html', color: [0, 217, 255], text: 'The players worth knowing: stars, FKDR, notes and nicks.', go: 'Open tracker', preview: 'players' },
    { name: 'Cosmetics Library', href: 'cosmetics.html', color: [168, 85, 247], text: 'Every kill effect, death cry and skin, with rarity and price.', go: 'Browse cosmetics', preview: 'cosmetic' },
    { name: 'Prism Atlas', href: 'atlas.html', color: [255, 184, 77], text: 'Every Bed Wars map in 3D, from the top down or on foot.', go: 'Explore maps', preview: 'atlas' }
  ];

  var API = 'https://bedwars-backend.onrender.com';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- cards ---------- */
  var cardsEl = document.getElementById('cards');
  var ARROW = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  PAGES.forEach(function (pg, i) {
    var a = document.createElement('a'); a.className = 'card'; a.href = pg.href;
    a.style.setProperty('--c', pg.color.join(',')); a.style.animationDelay = (0.7 + i * 0.14) + 's';
    var thumb = '';
    if (pg.preview === 'players') thumb = '<div class="thumb"><div class="tlist" id="players"></div></div>';
    else if (pg.preview) thumb = '<div class="thumb open"><canvas data-draw="' + pg.preview + '"></canvas></div>';
    else a.style.gridTemplateColumns = 'minmax(0,1fr)';
    a.innerHTML = thumb + '<div><h2>' + esc(pg.name) + '</h2><p>' + esc(pg.text) + '</p><span class="go">' + esc(pg.go || 'Open') + ' ' + ARROW + '</span></div>';
    cardsEl.appendChild(a);
  });
  var cards = Array.prototype.slice.call(cardsEl.children);
  var hot = cards.map(function () { return 0; }), hotT = hot.slice();
  cards.forEach(function (c, i) {
    function on() { hotT[i] = 1; } function off() { hotT[i] = 0; }
    c.addEventListener('mouseenter', on); c.addEventListener('mouseleave', off); c.addEventListener('focus', on); c.addEventListener('blur', off);
  });

  /* ---------- where things are, in page pixels relative to <main> (shared with the 3D scene) ---------- */
  var main = document.querySelector('main');
  var mouse = { x: 0, y: 0, tx: 0, ty: 0, px: -9999, py: -9999 };
  addEventListener('pointermove', function (e) { var r = main.getBoundingClientRect(); mouse.tx = (e.clientX / innerWidth) * 2 - 1; mouse.ty = (e.clientY / innerHeight) * 2 - 1; mouse.px = e.clientX - r.left; mouse.py = e.clientY - r.top; }, { passive: true });
  document.addEventListener('pointerleave', function () { mouse.tx = 0; mouse.ty = 0; mouse.px = mouse.py = -9999; });
  var introStart = performance.now();
  window.PRISM = {
    pages: PAGES, reduce: reduce, mouse: mouse, introStart: introStart,
    layout: function () {
      var r = main.getBoundingClientRect(), spot = document.getElementById('prismSpot').getBoundingClientRect();
      var narrow = innerWidth <= 980;
      var size = Math.min(spot.height * 0.92, spot.width * 0.62, 400);
      var x = narrow ? spot.left - r.left + spot.width / 2 : spot.left - r.left + Math.min(spot.width * 0.42, size * 1.15);
      var y = spot.top - r.top + spot.height * 0.5;
      var first = cards[0] && cards[0].getBoundingClientRect();
      var targets = cards.map(function (card, i) {
        var cr = card.getBoundingClientRect();
        if (narrow) return { x: first.left - r.left + first.width * ((i + 0.8) / (cards.length + 0.6)), y: first.top - r.top + 1 };
        return { x: cr.left - r.left + 14, y: cr.top - r.top + cr.height / 2 }; // ends just under the card's edge: no gap
      });
      for (var i = 0; i < hot.length; i++) hot[i] += (hotT[i] - hot[i]) * 0.1;
      mouse.x += (mouse.tx - mouse.x) * 0.05; mouse.y += (mouse.ty - mouse.y) * 0.05;
      return { W: r.width, H: r.height, prism: { x: x, y: y, size: size }, targets: targets, hot: hot, narrow: narrow,
        source: narrow ? { x: -40, y: y - size * 0.95 } : { x: -60, y: y - size * 0.32 } };
    },
    ready3d: false
  };

  /* ---------- live top players (same index as the site: FKDR² × stars) ---------- */
  var PRESTIGE = ['#aaaaaa', '#ffffff', '#ffaa00', '#55ffff', '#00aa00', '#00aaaa', '#aa0000', '#ff55ff', '#5555ff', '#aa00aa'];
  function starColor(s) { if (s >= 1000) return ['#ff5555', '#ffaa00', '#ffff55', '#55ff55', '#55ffff', '#ff55ff'][Math.floor(s / 100) % 6]; return PRESTIGE[Math.floor(s / 100) % 10]; }
  var listEl = document.getElementById('players');
  function playersList(rows, msg) {
    if (!listEl) return;
    listEl.innerHTML = ''; var ol = document.createElement('ol'); listEl.appendChild(ol);
    if (!rows) {
      for (var g = 0; g < 5; g++) ol.insertAdjacentHTML('beforeend', '<li class="ghost"><span class="av"></span><span class="nm">.</span><span class="st">.</span></li>');
      if (msg) listEl.insertAdjacentHTML('beforeend', '<div class="msg">' + esc(msg) + '</div>');
      return;
    }
    var offset = 0, n = 5;
    function render() {
      ol.innerHTML = '';
      for (var i = 0; i < Math.min(n + 1, rows.length); i++) {
        var p = rows[(i + offset) % rows.length];
        ol.insertAdjacentHTML('beforeend', '<li><img class="av" alt="" loading="lazy" src="https://mc-heads.net/avatar/' + encodeURIComponent(p.uuid || p.name) + '/24"><span class="nm">' + esc(p.name) + '</span><span class="st" style="color:' + starColor(p.star) + '">[' + p.star + '✫]</span></li>');
      }
    }
    render();
    if (reduce || rows.length <= n) return;
    setInterval(function () {
      if (document.hidden) return;
      var row = ol.firstChild; if (!row) return;
      ol.style.transform = 'translateY(-' + (row.offsetHeight + 4) + 'px)';
      setTimeout(function () { ol.style.transition = 'none'; offset = (offset + 1) % rows.length; render(); ol.style.transform = ''; void ol.offsetHeight; ol.style.transition = ''; }, 720);
    }, 2600);
  }
  // footer counts: each one appears once it's known
  function showTally(id, numId, n) {
    document.getElementById(numId).textContent = Number(n).toLocaleString('en-US');
    document.getElementById(id).hidden = false;
    document.getElementById('tally').hidden = false;
  }
  // cosmetics: count the entries in the library's own list, so it always matches that page
  fetch('cosmetics.html').then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
    var a = t.indexOf('const ITEMS = ['), b = a < 0 ? -1 : t.indexOf('\n];', a);
    var n = b < 0 ? 0 : (t.slice(a, b).match(/\bid: "/g) || []).length;
    if (n) showTally('tallyC', 'tallyCN', n);
  }).catch(function () {});
  // maps: just the number from the Atlas (no map data needs a key for this)
  (async function () {
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var r = await fetch(API + '/maps/count', { cache: 'no-store' });
        if (r.ok) { var j = await r.json(); if (j && j.maps > 0) showTally('tallyM', 'tallyMN', j.maps); return; }
        if (r.status === 404) return;
      } catch (e) {}
      await new Promise(function (res) { setTimeout(res, 4000); });
    }
  })();

  if (listEl) {
    playersList(null);
    var slow = setTimeout(function () { playersList(null, 'Waking server'); }, 3000);
    (async function () {
      var res = null;
      for (var attempt = 0; attempt < 3; attempt++) {
        try { res = await fetch(API + '/sweats', { cache: 'no-store' }); if (res.ok) break; } catch (e) { res = null; }
        await new Promise(function (r) { setTimeout(r, 4000); });
      }
      clearTimeout(slow);
      if (!res || !res.ok) { playersList(null, res && (res.status === 401 || res.status === 403) ? 'Key needed' : 'Server asleep'); return; }
      var list = await res.json().catch(function () { return null; });
      if (!Array.isArray(list)) { playersList(null, 'Key needed'); return; }
      var best = new Map();
      list.forEach(function (s) {
        if (s.deletedAt) return;
        var key = s.uuid || String(s.username || '').toLowerCase(), f = Number(s.fkdr) || 0, st = Math.floor(Number(s.star) || 0);
        var row = { name: s.username, uuid: s.uuid, star: st, index: f * f * st, at: String(s.dateAdded || s.createdAt || '') };
        var old = best.get(key); if (!old || row.at > old.at) best.set(key, row); // latest record per player
      });
      var rows = Array.from(best.values()).sort(function (a, b) { return b.index - a.index; }).slice(0, 12);
      showTally('tallyP', 'tallyN', best.size);
      playersList(rows);
    })();
  }

  /* ---------- the real 1.8 diamond sword as a solid voxel model (each pixel is a little block),
     spinning like a dropped item. Sides are drawn, so it looks solid even edge-on. ---------- */
  function loadImg(src) { var im = new Image(); im.src = src; return im; }
  var swordImg = loadImg('home/diamond-sword.png'), swordVox = null;
  function voxels(im) {

  const spin = { drag: false, id: null, lx: 0, ly: 0, vy: AUTO, vx: 0, tiltX: 0.12, lastL: null };
  const nearPrism = (e) => { const L = spin.lastL; if (!L) return false; const r = canvas.getBoundingClientRect();
    const dx = e.clientX - r.left - L.prism.x, dy = e.clientY - r.top - L.prism.y; return Math.hypot(dx, dy) < L.prism.size * 0.75; };
  addEventListener("pointerdown", (e) => {

    document.body.style.cursor = "grabbing"; document.body.style.userSelect = "none"; e.preventDefault();
  });
  addEventListener("pointermove", (e) => {
    if (!spin.drag) { if (e.pointerType === "mouse") document.body.style.cursor = nearPrism(e) && !e.target.closest("a, button") ? "grab" : ""; return; }
    if (e.pointerId !== spin.id) return;
    const dx = e.clientX - spin.lx, dy = e.clientY - spin.ly; spin.lx = e.clientX; spin.ly = e.clientY;
    prismGroup.rotation.y += dx * 0.01; spin.tiltX = Math.max(-1.2, Math.min(1.2, spin.tiltX + dy * 0.01));
    spin.vy = dx * 0.6; spin.vx = dy * 0.6;
  });
  const endDrag = (e) => { if (!spin.drag || (e && e.pointerId !== spin.id)) return; spin.drag = false; document.body.style.cursor = ""; document.body.style.userSelect = ""; };
  addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
  document.querySelector(".prism-spot").style.touchAction = "none";

  const t0 = performance.now(); let shown = false, last = t0;
  function frame(now) {
    if (document.hidden && shown) { requestAnimationFrame(frame); return; }
    const L = P.layout(); resize(L);
    const t = P.reduce ? 3 : (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
    const it = P.reduce ? 9 : (now - P.introStart) / 1000;
    const grow = Math.min(1, Math.max(0, it / 0.7)), split = Math.min(1, Math.max(0, (it - 0.6) / 0.8));
    const ease = (x) => 1 - Math.pow(1 - x, 3);
    const px = L.prism.x, py = -L.prism.y, S = L.prism.size;
    // background + dust
    bgMat.uniforms.uT.value = t; bgMat.uniforms.uPrism.value.set(px, H - L.prism.y); bgMat.uniforms.uMouse.value.set(P.mouse.x, -P.mouse.y);
    dustMat.uniforms.uT.value = t; dustMat.uniforms.uPar.value.set(-P.mouse.x, P.mouse.y);
    dustMat.uniforms.uPtr.value.set(P.mouse.px - W / 2, -(P.mouse.py - H / 2));
    // incoming white beam: from off screen into the middle of the prism
    inBeam.uniforms.uA.value.set(L.source.x, -L.source.y); inBeam.uniforms.uB.value.set(px, py);
    inBeam.uniforms.uGrow.value = ease(grow); inBeam.uniforms.uW0.value = S * 0.06; inBeam.uniforms.uW1.value = S * 0.05; inBeam.uniforms.uCore.value = Math.max(1.3, S * 0.006); inBeam.uniforms.uT.value = t; inBeam.uniforms.uSpeed.value = 2.2;
    // split beams: from the middle of the prism to each card's edge
    L.targets.forEach((tg, i) => {
      const u = outBeams[i].uniforms, h = L.hot[i];
      u.uA.value.set(px, py); u.uB.value.set(tg.x, -tg.y); u.uGrow.value = ease(split);
      u.uW0.value = S * 0.03; u.uW1.value = (L.narrow ? 18 : S * 0.13) * (1 + h * 0.5); u.uCore.value = Math.max(1.2, S * 0.0045) * (1 + h * 0.7);
      u.uI.value = (0.75 + h * 0.75); u.uT.value = t; u.uSpeed.value = 2.6 + h * 2.5;
      const sp = landSpots[i]; sp.position.set(tg.x, -tg.y, 0); const sz = (L.narrow ? 70 : S * 0.42) * (1 + h * 0.6); sp.scale.set(sz, sz, 1); sp.material.uniforms.uI.value = split >= 1 ? 0.4 + h * 0.5 : 0;
    });
    splitSpot.position.set(px, py, 0); const ss = S * 0.55 * (1 + 0.06 * Math.sin(t * 2.2)); splitSpot.scale.set(ss, ss, 1); splitSpot.material.uniforms.uI.value = 0.2 + 0.4 * ease(grow) * (0.85 + 0.15 * Math.sin(t * 3.1));

    prismGroup.position.set(px, py, 0); prismGroup.scale.setScalar(S * 0.5);
    spin.lastL = L;
    if (!spin.drag) {
      if (!P.reduce || spin.vy !== AUTO) { prismGroup.rotation.y += dt * spin.vy; spin.vy += (( P.reduce ? 0 : AUTO) - spin.vy) * Math.min(1, dt * 1.6); }
      spin.tiltX += dt * spin.vx; spin.vx *= Math.max(0, 1 - dt * 3);
      spin.tiltX += (0.12 - spin.tiltX) * Math.min(1, dt * 0.8);
    }
    prismGroup.rotation.x = spin.tiltX + (P.reduce ? 0 : Math.sin(t * 0.45) * 0.05);
    prismGroup.rotation.z = 0;
    rimMat.uniforms.uT.value = t;
    composer.render();
    if (!shown) { shown = true; canvas.classList.add("on"); P.ready3d = true; }
    if (!P.reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (P.reduce) { addEventListener("resize", () => requestAnimationFrame(frame)); addEventListener("pointermove", () => { if (spin.drag) requestAnimationFrame(frame); }); }
}
