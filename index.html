<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Prism home page: a beam of light goes through a prism and splits into one beam per page.
     To add a page, add one entry to PAGES in the script below (name, link, colour, preview);
     the card and its beam are made from that list. Old tracker links (anything with ?query or
     #hash) are sent on to tracker.html so shared links keep working. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://mc-heads.net; connect-src 'self' https://bedwars-backend.onrender.com; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<script>
  // The tracker used to live here. Its links carry ?player=, ?lb= or #section, so pass those on.
  if (location.search || (location.hash && location.hash !== '#')) location.replace('tracker.html' + location.search + location.hash);
</script>
<title>Prism</title>
<meta name="description" content="Prism: the Bed Wars tracker, cosmetics library and map atlas.">
<meta name="theme-color" content="#04050a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: wordmark + prism on the left, one card per page on the right, light beams joining them.
     Phones: prism on top, cards stacked below. Uses the site's Neon colours. */
  :root {
    --bg: #04050a; --panel: #12151f; --panel-2: #1a1f2d;
    --line: rgba(255,255,255,0.09); --text: #eef0f6; --dim: #8f98ab; --faint: #6c7486;
    --cyan: #00d9ff; --violet: #a855f7; --gold: #ffb84d;
    --font: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(.22,.85,.32,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

  .topbar { display: flex; align-items: center; gap: 18px; padding-block: 22px; }
  .mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; font-size: 17px; }
  .mark svg { width: 26px; height: 26px; }
  .topbar nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .topbar nav a { color: var(--dim); font-size: 14px; padding: 7px 12px; border-radius: 8px; transition: color .2s, background .2s; }
  .topbar nav a:hover { color: var(--text); background: var(--panel); }

  .grad { background: linear-gradient(100deg, #fff 0%, var(--cyan) 38%, var(--violet) 68%, var(--gold) 100%); background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 9s ease-in-out infinite alternate; }
  @keyframes sheen { from { background-position: 0% 0; } to { background-position: 100% 0; } }

  main { position: relative; }
  #beamCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 560px); gap: 40px; align-items: center; padding-block: 30px 70px; min-height: 620px; }
  .hero-left { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 18px; }
  .hero-left h1 { margin: 0; font-size: clamp(64px, 10vw, 128px); line-height: .9; font-weight: 800; letter-spacing: -.035em; }
  .hero-left p { margin: 0; color: var(--dim); font-size: 18px; line-height: 1.55; max-width: 34ch; }
  .prism-spot { height: 240px; }

  .cards { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 16px; }
  .card { --c: var(--cyan); position: relative; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; padding: 12px 20px 12px 12px;
    background: rgba(18,21,31,0.84); border: 1px solid var(--line); border-radius: 18px; transition: transform .45s var(--ease), border-color .3s, box-shadow .3s; }
  .card::before { content: ""; position: absolute; left: -1px; top: 18%; bottom: 18%; width: 3px; border-radius: 3px; background: var(--c); box-shadow: 0 0 14px var(--c); opacity: .9; }
  .card:hover, .card:focus-visible { transform: translateX(-8px); border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 18px 40px -18px var(--c); }
  .card .thumb { position: relative; height: 112px; border-radius: 12px; overflow: hidden; background: #0a0c13; }
  .card .thumb canvas, .card .thumb .tlist { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card h2 { margin: 0 0 4px; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .card p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  .card .go { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--c); }
  .card .go svg { transition: transform .3s var(--ease); }
  .card:hover .go svg { transform: translateX(4px); }

  .foot { position: relative; z-index: 2; display: flex; gap: 22px; flex-wrap: wrap; color: var(--faint); font-size: 13px; padding-block: 18px 40px; border-top: 1px solid var(--line); }
  .foot b { color: var(--text); font-variant-numeric: tabular-nums; }
  .foot .by { margin-left: auto; }

  /* Intro: the beam lights first (canvas), then the cards slide in */
  .card { animation: cardIn .8s var(--ease) both; }
  .hero-left h1 { animation: rise .9s var(--ease) both; }
  @keyframes cardIn { from { transform: translateX(26px); opacity: .25; } }
  @keyframes rise { from { transform: translateY(14px); opacity: .25; letter-spacing: .02em; } }

  /* Tracker preview: top players, scrolling */
  .tlist { overflow: hidden; font-size: 12px; }
  .tlist ol { list-style: none; margin: 0; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; transition: transform .7s var(--ease); }
  .tlist li { display: grid; grid-template-columns: 16px 18px minmax(0,1fr) auto; align-items: center; gap: 7px; height: 22px; padding: 0 6px; border-radius: 6px; background: rgba(255,255,255,0.035); }
  .card .tlist .rk { display: none; }
  .card .tlist li { grid-template-columns: 18px minmax(0,1fr) auto; gap: 6px; }
  .tlist .rk { color: var(--faint); font: 700 10px var(--mono); text-align: right; }
  .tlist .av { width: 18px; height: 18px; border-radius: 4px; image-rendering: pixelated; background: var(--panel-2); }
  .tlist .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .tlist .st { font: 700 11px var(--mono); }
  .tlist li.ghost .nm, .tlist li.ghost .st { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); color: transparent; animation: pulse 1.4s ease-in-out infinite; }
  .tlist li.ghost .nm { width: 70%; } .tlist li.ghost .st { width: 38px; }
  .tlist .msg { position: absolute; inset: auto 0 6px; text-align: center; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  @keyframes pulse { 50% { opacity: .45; } }

  @media (max-width: 860px) {
    .hero { grid-template-columns: minmax(0, 1fr); gap: 16px; min-height: 0; padding-block: 10px 40px; }
    .prism-spot { height: 170px; }
    .card { grid-template-columns: 104px minmax(0, 1fr); gap: 14px; }
    .card .thumb { height: 92px; }
    .card:hover { transform: none; }
    .foot .by { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <canvas id="beamCanvas" aria-hidden="true"></canvas>
  <div class="wrap">
    <header class="topbar">
      <a class="mark" href="./"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2 24 22H2Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M13 9v13" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/></svg>Prism</a>
      <nav aria-label="More"><a href="hall-of-fame.html">Hall of Fame</a></nav>
    </header>
    <div class="hero">
      <div class="hero-left">
        <span class="eyebrow">Bed Wars, split into colours</span>
        <h1><span class="grad">Prism</span></h1>
        <p>Track the sweats you queue into. Browse every cosmetic in 3D. Fly over every map in rotation.</p>
        <div class="prism-spot" id="prismSpot"></div>
      </div>
      <nav class="cards" id="cards" aria-label="Prism pages"></nav>
    </div>
    <footer class="foot"><span id="tally" hidden><b id="tallyN">0</b> players tracked</span><span class="by">Made by Milo</span></footer>
  </div>
</main>

<script>
(function () {
  /* ---------- The pages. Add one entry here to add a card and a beam. ----------
     preview: 'players' (live top players), 'cosmetic' (spinning sword), 'atlas' (map from above), or none. */
  var PAGES = [
    { name: 'Prism Tracker', href: 'tracker.html', color: [0, 217, 255], text: 'The players worth knowing: stars, FKDR, notes and nicks.', go: 'Open tracker', preview: 'players' },
    { name: 'Cosmetics Library', href: 'cosmetics.html', color: [168, 85, 247], text: 'Every kill effect, death cry and skin, with rarity and price.', go: 'Browse cosmetics', preview: 'cosmetic' },
    { name: 'Prism Atlas', href: 'atlas.html', color: [255, 184, 77], text: 'Every Bed Wars map in 3D, from the top down or on foot.', go: 'Explore maps', preview: 'atlas' }
  ];

  var API = 'https://bedwars-backend.onrender.com';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- build the cards ---------- */
  var cardsEl = document.getElementById('cards');
  var ARROW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  PAGES.forEach(function (pg, i) {
    var a = document.createElement('a'); a.className = 'card'; a.href = pg.href;
    a.style.setProperty('--c', 'rgb(' + pg.color.join(',') + ')'); a.style.animationDelay = (0.55 + i * 0.15) + 's';
    var thumb = '';
    if (pg.preview === 'players') thumb = '<div class="thumb"><div class="tlist" id="players"></div></div>';
    else if (pg.preview) thumb = '<div class="thumb"><canvas data-draw="' + pg.preview + '"></canvas></div>';
    else a.style.gridTemplateColumns = 'minmax(0,1fr)';
    a.innerHTML = thumb + '<div><h2>' + esc(pg.name) + '</h2><p>' + esc(pg.text) + '</p><span class="go">' + esc(pg.go || 'Open') + ' ' + ARROW + '</span></div>';
    cardsEl.appendChild(a);
  });

  /* ---------- live top players (same index as the site: FKDR² × stars) ---------- */
  var PRESTIGE = ['#aaaaaa', '#ffffff', '#ffaa00', '#55ffff', '#00aa00', '#00aaaa', '#aa0000', '#ff55ff', '#5555ff', '#aa00aa'];
  function starColor(s) { if (s >= 1000) return ['#ff5555', '#ffaa00', '#ffff55', '#55ff55', '#55ffff', '#ff55ff'][Math.floor(s / 100) % 6]; return PRESTIGE[Math.floor(s / 100) % 10]; }
  var listEl = document.getElementById('players');
  function playersList(rows, msg) {
    if (!listEl) return;
    listEl.innerHTML = ''; var ol = document.createElement('ol'); listEl.appendChild(ol);
    if (!rows) {
      for (var g = 0; g < 5; g++) ol.insertAdjacentHTML('beforeend', '<li class="ghost"><span class="rk">' + (g + 1) + '</span><span class="av"></span><span class="nm">.</span><span class="st">.</span></li>');
      if (msg) listEl.insertAdjacentHTML('beforeend', '<div class="msg">' + esc(msg) + '</div>');
      return;
    }
    var offset = 0, n = 5;
    function render() {
      ol.innerHTML = '';
      for (var i = 0; i < Math.min(n + 1, rows.length); i++) {
        var k = (i + offset) % rows.length, p = rows[k];
        ol.insertAdjacentHTML('beforeend', '<li><span class="rk">' + (k + 1) + '</span><img class="av" alt="" loading="lazy" src="https://mc-heads.net/avatar/' + encodeURIComponent(p.uuid || p.name) + '/18"><span class="nm">' + esc(p.name) + '</span><span class="st" style="color:' + starColor(p.star) + '">[' + p.star + '✫]</span></li>');
      }
    }
    render();
    if (reduce || rows.length <= n) return;
    setInterval(function () {
      if (document.hidden) return;
      var row = ol.firstChild; if (!row) return;
      ol.style.transform = 'translateY(-' + (row.offsetHeight + 4) + 'px)';
      setTimeout(function () { ol.style.transition = 'none'; offset = (offset + 1) % rows.length; render(); ol.style.transform = ''; void ol.offsetHeight; ol.style.transition = ''; }, 720);
    }, 2400);
  }
  if (listEl) {
    playersList(null);
    var slow = setTimeout(function () { playersList(null, 'Waking up the server'); }, 3000);
    (async function () {
      var res = null;
      for (var attempt = 0; attempt < 3; attempt++) {
        try { res = await fetch(API + '/sweats', { cache: 'no-store' }); if (res.ok) break; } catch (e) { res = null; }
        await new Promise(function (r) { setTimeout(r, 4000); });
      }
      clearTimeout(slow);
      if (!res || !res.ok) { playersList(null, res && (res.status === 401 || res.status === 403) ? 'Key needed' : 'Server asleep'); return; }
      var list = await res.json().catch(function () { return null; });
      if (!Array.isArray(list)) { playersList(null, 'Key needed'); return; }
      var best = new Map();
      list.forEach(function (s) {
        if (s.deletedAt) return;
        var key = s.uuid || String(s.username || '').toLowerCase(), f = Number(s.fkdr) || 0, st = Math.floor(Number(s.star) || 0);
        var row = { name: s.username, uuid: s.uuid, star: st, index: f * f * st, at: String(s.dateAdded || s.createdAt || '') };
        var old = best.get(key); if (!old || row.at > old.at) best.set(key, row); // latest record per player
      });
      var rows = Array.from(best.values()).sort(function (a, b) { return b.index - a.index; }).slice(0, 12);
      document.getElementById('tallyN').textContent = best.size.toLocaleString('en-US');
      document.getElementById('tally').hidden = false;
      playersList(rows);
    })();
  }

  /* ---------- pixel diamond sword that spins ---------- */
  var SWORD = [
    '............ooo.',
    '...........obbo.',
    '..........obBBo.',
    '.........obBBo..',
    '........obBBo...',
    '.......obBBo....',
    '......obBBo.....',
    '..oo.obBBo......',
    '..ogoobBo.......',
    '...ogobo........',
    '....ogo.........',
    '...ohoog........',
    '..oho..oo.......',
    '.oho............',
    'ooo.............',
    '.o..............'
  ];
  var SC = { o: '#0b3b44', b: '#c8fbff', B: '#2bd4e0', g: '#1d8a95', h: '#7a4f25' };
  function drawCosmetic(ctx, w, h, t, big) {
    var g = ctx.createRadialGradient(w / 2, h * .45, 0, w / 2, h * .45, Math.max(w, h) * .7);
    g.addColorStop(0, '#2a1d47'); g.addColorStop(.55, '#120f22'); g.addColorStop(1, '#07080f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    var size = Math.min(w, h) * (big ? .42 : .62), px = size / 16;
    var cx = w / 2, cy = h * (big ? .4 : .48) + Math.sin(t * 1.6) * px * .8;
    // floor glow
    ctx.save(); ctx.globalAlpha = .55; var fg = ctx.createRadialGradient(cx, cy + size * .62, 0, cx, cy + size * .62, size * .6); fg.addColorStop(0, 'rgba(168,85,247,.55)'); fg.addColorStop(1, 'rgba(168,85,247,0)'); ctx.fillStyle = fg; ctx.fillRect(cx - size, cy + size * .3, size * 2, size * .7); ctx.restore();
    // orbiting sparks
    for (var i = 0; i < (big ? 26 : 12); i++) {
      var a = t * (.6 + (i % 5) * .08) + i * 2.399, r = size * (.55 + (i % 4) * .09), y = Math.sin(a * 1.3 + i) * size * .35;
      var x = Math.cos(a) * r, z = Math.sin(a); if (z < 0) continue;
      ctx.globalAlpha = .35 + z * .6; ctx.fillStyle = i % 3 ? '#c9a2ff' : '#7ff3ff';
      var s = px * (.35 + z * .35); ctx.fillRect(cx + x - s / 2, cy + y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    var sx = Math.cos(t * 1.25); var shade = .55 + .45 * Math.abs(sx);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sx < 0 ? -Math.max(.06, -sx) : Math.max(.06, sx), 1); ctx.translate(-size / 2, -size / 2);
    for (var yy = 0; yy < 16; yy++) for (var xx = 0; xx < 16; xx++) {
      var k = SWORD[yy][xx]; if (k === '.') continue; ctx.fillStyle = SC[k]; ctx.fillRect(xx * px, yy * px, px + .6, px + .6);
    }
    ctx.globalAlpha = 1 - shade; ctx.fillStyle = '#000'; ctx.globalCompositeOperation = 'source-atop'; ctx.fillRect(0, 0, size, size);
    ctx.restore(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // front sparks
    for (var j = 0; j < (big ? 26 : 12); j++) {
      var a2 = t * (.6 + (j % 5) * .08) + j * 2.399, r2 = size * (.55 + (j % 4) * .09), y2 = Math.sin(a2 * 1.3 + j) * size * .35, z2 = Math.sin(a2);
      if (z2 >= 0) continue; ctx.globalAlpha = .9; ctx.fillStyle = j % 3 ? '#e2ccff' : '#b8fbff'; var s2 = px * (.5 - z2 * .4); ctx.fillRect(cx + Math.cos(a2) * r2 - s2 / 2, cy + y2 - s2 / 2, s2, s2);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- top-down 8-team map ---------- */
  var TEAMS = ['#ff5555', '#5555ff', '#55ff55', '#ffff55', '#55ffff', '#ffffff', '#ff55ff', '#aaaaaa'];
  function drawAtlas(ctx, w, h, t, big) {
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, w, h);
    var R = Math.min(w, h) * (big ? .36 : .42), p = R / 13, cx = w / 2, cy = h * (big ? .42 : .5);
    // faint void grid
    ctx.strokeStyle = 'rgba(255,184,77,0.06)'; ctx.lineWidth = 1;
    for (var gx = (cx % (p * 4)); gx < w; gx += p * 4) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
    for (var gy = (cy % (p * 4)); gy < h; gy += p * 4) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .06); ctx.scale(1, big ? .78 : .8);
    function block(x, y, bw, bh, c) { ctx.fillStyle = c; ctx.fillRect(x * p, y * p, bw * p, bh * p); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x * p, (y + bh) * p - p * .35, bw * p, p * .35); }
    // bridges
    ctx.strokeStyle = 'rgba(200,190,170,.18)'; ctx.lineWidth = p * .45; ctx.setLineDash([p * .5, p * .35]);
    for (var b = 0; b < 8; b++) { var a = b / 8 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 2.6 * p, Math.sin(a) * 2.6 * p); ctx.lineTo(Math.cos(a) * 9 * p, Math.sin(a) * 9 * p); ctx.stroke(); }
    ctx.setLineDash([]);
    // centre island
    block(-2.5, -2.5, 5, 5, '#6b6f7a'); block(-1.5, -1.5, 3, 3, '#8a8f9c');
    // emerald islands
    for (var e = 0; e < 4; e++) { var ea = e / 4 * Math.PI * 2 + Math.PI / 4; var ex = Math.cos(ea) * 4.2, ey = Math.sin(ea) * 4.2; block(ex - 1, ey - 1, 2, 2, '#4b7a3a'); var pe = .5 + .5 * Math.sin(t * 2 + e); ctx.fillStyle = 'rgba(80,255,140,' + (.45 + pe * .5) + ')'; ctx.fillRect((ex - .35) * p, (ey - .35) * p, .7 * p, .7 * p); }
    // team + diamond islands
    for (var i = 0; i < 8; i++) {
      var ta = i / 8 * Math.PI * 2, tx = Math.cos(ta) * 10.2, ty = Math.sin(ta) * 10.2;
      ctx.save(); ctx.translate(tx * p, ty * p); ctx.rotate(ta + Math.PI / 2);
      block(-2, -1.6, 4, 3.4, '#5c8a3e'); block(-1.6, -1.2, 3.2, 1.2, TEAMS[i]);
      ctx.fillStyle = '#c62828'; ctx.fillRect(-.5 * p, .3 * p, 1 * p, .55 * p); // bed
      ctx.restore();
      var da = ta + Math.PI / 8, dx = Math.cos(da) * 7.2, dy = Math.sin(da) * 7.2; block(dx - .8, dy - .8, 1.6, 1.6, '#55606d');
      var pd = .5 + .5 * Math.sin(t * 2.6 + i * .9); ctx.fillStyle = 'rgba(90,240,255,' + (.35 + pd * .6) + ')'; ctx.fillRect((dx - .3) * p, (dy - .3) * p, .6 * p, .6 * p);
    }
    ctx.restore();
    // sweep of sunlight
    var sw = ((t * .18) % 1.6 - .3) * w; var lg = ctx.createLinearGradient(sw - w * .2, 0, sw + w * .2, h);

  }

  /* ---------- preview canvases ---------- */

  });

    var outP = narrow ? [(pts[1][0] + pts[2][0]) / 2, (pts[1][1] + pts[2][1]) / 2] : [(pts[0][0] + pts[1][0]) / 2 + size * .02, (pts[0][1] + pts[1][1]) / 2 + size * .06];

    for (var L = 0; L < 3; L++) { ctx.strokeStyle = 'rgba(255,255,255,' + [0.06, 0.16, 0.9][L] + ')'; ctx.lineWidth = [16, 7, 1.8][L]; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke(); }
    var first = cards[0] && cards[0].getBoundingClientRect();

      hot[i] += (hotT[i] - hot[i]) * .12;
      var cr = card.getBoundingClientRect(), tx, ty;
      if (narrow) { tx = first.left - r.left + first.width * ((i + .7) / (cards.length + .4)); ty = first.top - r.top + 2; }
      else { tx = cr.left - r.left + 2; ty = cr.top - r.top + cr.height / 2; }

      var c = PAGES[i].color, k = .55 + hot[i] * .9;

      ctx.strokeStyle = rgba(c, .85 * k); ctx.lineWidth = 1.4 + hot[i]; ctx.beginPath(); ctx.moveTo(outP[0], outP[1]); ctx.lineTo(fx, fy); ctx.stroke();

    });

    var pg = ctx.createLinearGradient(pts[2][0], pts[0][1], pts[1][0], pts[1][1]); pg.addColorStop(0, 'rgba(255,255,255,.10)'); pg.addColorStop(.5, 'rgba(160,200,255,.04)'); pg.addColorStop(1, 'rgba(255,255,255,.12)');
    ctx.fillStyle = pg; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save(); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
    var cg = ctx.createLinearGradient(inP[0], inP[1], outP[0], outP[1]); cg.addColorStop(0, 'rgba(255,255,255,' + .35 * grow + ')'); cg.addColorStop(.6, 'rgba(0,217,255,' + .25 * split + ')'); cg.addColorStop(1, 'rgba(168,85,247,' + .35 * split + ')');
    ctx.strokeStyle = cg; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(inP[0], inP[1]); ctx.lineTo(outP[0], outP[1]); ctx.stroke(); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[0][0] + (pts[1][0] - pts[0][0]) * .3, pts[0][1] + (pts[1][1] - pts[0][1]) * .3); ctx.stroke();
  }

  var start = performance.now();
  function frame(now) {
    var t = reduce ? 2 : (now - start) / 1000;
    previews.forEach(function (o) { if (!sizeCanvas(o.c)) return; o.ctx.setTransform(1, 0, 0, 1, 0, 0); o.fn(o.ctx, o.c.width, o.c.height, t, false); });

  }
  requestAnimationFrame(frame);
  if (reduce) { addEventListener('resize', function () { requestAnimationFrame(frame); }); document.fonts && document.fonts.ready.then(function () { requestAnimationFrame(frame); }); }
})();
