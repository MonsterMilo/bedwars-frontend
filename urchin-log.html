<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://mc-heads.net https://textures.minecraft.net https://visage.surgeplay.com; connect-src 'self' https://bedwars-backend.onrender.com https://jaayminecraft.github.io; media-src 'self' data: blob: https://resources.download.minecraft.net; worker-src 'self' blob:; object-src 'none'; frame-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Urchin Log</title>
<!-- Every Urchin call (backend + Prism), from GET /urchin-log. Full-access keys only (Milo 2026-11-18). -->
<style>
  :root { --bg: #0b0d12; --panel: #141821; --line: #252b38; --text: #e6e9ef; --dim: #8a93a6; --bad: #ff6b6b; --warn: #ffb547; --ok: #5ad19a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f6f8; --panel: #fff; --line: #e1e4ea; --text: #161a22; --dim: #667085; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 18px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  select, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .card span { color: var(--dim); font-size: 12px; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  .bad { color: var(--bad); } .warn { color: var(--warn); } .ok { color: var(--ok); }
  #msg { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Urchin log</h1>
  <p class="sub">Every call to Urchin from the website and Prism. "Left" is Urchin's count for the whole key, so if it drops while our calls stay low, something else is using the key.</p>
  <div class="bar">
    <select id="hours">
      <option value="1">Last hour</option>
      <option value="2" selected>Last 2 hours</option>
      <option value="6">Last 6 hours</option>
      <option value="24">Last day</option>
      <option value="168">Last week</option>
    </select>
    <button id="reload">Refresh</button>
    <span id="msg"></span>
  </div>
  <div class="cards" id="cards"></div>
  <h2>Per 5 minutes</h2>
  <div class="wrap"><table id="slots"><thead><tr><th>Time</th><th>Website</th><th>Prism</th><th>Errors</th><th>Lowest left (of 600)</th></tr></thead><tbody></tbody></table></div>
  <h2>Latest calls</h2>
  <div class="wrap"><table id="recent"><thead><tr><th>Time</th><th>From</th><th>Call</th><th>Player</th><th>Result</th><th>Left</th></tr></thead><tbody></tbody></table></div>
</main>
<script>
const BACKEND = "https://bedwars-backend.onrender.com";
const key = (() => { try { return localStorage.getItem("bedwarsAdminKey") || ""; } catch { return ""; } })();
const $ = id => document.getElementById(id);
const time = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const day = iso => new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
const cell = (text, cls) => { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; return td; };
const leftCls = n => n == null ? "" : n < 100 ? "bad" : n < 300 ? "warn" : "ok";
const statusCls = s => s === 200 || s === 404 ? "ok" : s === 429 || s === 403 ? "bad" : "warn";

async function load() {
  if (!key) { $("msg").textContent = "Sign in on the tracker with your key first."; return; }
  $("msg").textContent = "Loading...";
  try {
    const res = await fetch(`${BACKEND}/urchin-log?hours=${$("hours").value}`, { headers: { "x-admin-key": key } });
    const data = await res.json();
    if (!res.ok) { $("msg").textContent = data.error || `Error ${res.status}`; return; }
    const slots = data.perFiveMin || [];
    const sum = f => slots.reduce((a, s) => a + (s[f] || 0), 0);
    const lows = slots.map(s => s.minRemaining).filter(n => n != null);
    const busiest = slots.reduce((a, s) => Math.max(a, s.backend + s.prism), 0);
    $("cards").innerHTML = "";
    for (const [n, label, cls] of [[sum("backend"), "website calls"], [sum("prism"), "Prism calls"], [busiest, "most in 5 min"], [lows.length ? Math.min(...lows) : "-", "lowest left", lows.length ? leftCls(Math.min(...lows)) : ""], [sum("errors"), "errors", sum("errors") ? "bad" : ""]]) {
      const c = document.createElement("div"); c.className = "card";
      const b = document.createElement("b"); b.textContent = n; if (cls) b.className = cls;
      const s = document.createElement("span"); s.textContent = label;
      c.append(b, s); $("cards").append(c);
    }
    const tb = $("slots").tBodies[0]; tb.innerHTML = "";
    for (const s of slots) {
      const tr = document.createElement("tr");
      tr.append(cell(`${day(s.at)} ${time(s.at)}`), cell(s.backend), cell(s.prism), cell(s.errors, s.errors ? "bad" : ""), cell(s.minRemaining ?? "-", leftCls(s.minRemaining)));
      tb.append(tr);
    }
    if (!slots.length) { const tr = document.createElement("tr"); const td = cell("No calls in this time."); td.colSpan = 5; tr.append(td); tb.append(tr); }
    const rb = $("recent").tBodies[0]; rb.innerHTML = "";
    for (const r of data.recent || []) {
      const tr = document.createElement("tr");
      tr.append(cell(new Date(r.at).toLocaleTimeString()), cell(r.src === "prism" ? "Prism" : `Website${r.by ? " (" + r.by + ")" : ""}`), cell(r.path), cell(r.what || ""), cell(r.status || "failed", statusCls(r.status)), cell(r.remaining ?? "-", leftCls(r.remaining)));
      rb.append(tr);
    }
    $("msg").textContent = `${data.total} calls`;
  } catch (e) {
    $("msg").textContent = "Couldn't reach the backend (it may be waking up). Try again in a minute.";
  }
}
$("reload").onclick = load;
$("hours").onchange = load;
load();
</script>
</body>
</html>
